          return {land:'#d9b56c',river:'#7db8d7',riverHi:'rgba(255,255,255,.18)',shedu:'rgba(250,238,190,.35)',special:'#ffe483',special2:'#8a5b10',grid:'rgba(84,63,32,.65)',riverLine:'rgba(20,92,132,.55)'};
