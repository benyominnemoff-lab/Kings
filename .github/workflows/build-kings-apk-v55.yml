          function formatSave55(s){try{if(typeof formatSaveTitle52==='function')return formatSaveTitle52(s);if(typeof formatSaveTitle==='function')return formatSaveTitle(s);}catch(_){}return (s.name||s.label||s.type||'Save')+' — '+new Date(s.ts||Date.now()).toLocaleString();}
