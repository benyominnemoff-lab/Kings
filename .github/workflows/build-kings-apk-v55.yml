            for(let i=0;i<G.players.length;i++){
              let p=orderPlayerAt52(i),pl=G.players[p]||{},s=shapeData[i]||shapeData[0];
              let line2=(pl.ai?'':(esc(playerSymbol52(p))+' · '))+esc(s.name)+' '+shapeIcon52(i);
              out+='<div class="v52DynCard" style="background:'+bg[i]+';color:'+fg[i]+'"><div class="v52DynTop">'+esc(roman52(i)+' · '+displayName52(p))+'</div><div class="v52DynSub">'+line2+'</div></div>';
            }
