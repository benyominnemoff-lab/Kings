          function undoLastAction52(){if(!undo52){flash('Nothing safe to undo from the current turn.');return;}if(pendingSupport||pendingWarOrder||G.players[G.turn].ai){flash('Cannot undo during conflict resolution or an AI turn.');return;}try{G=JSON.parse(undo52);pendingSupport=null;pendingWarOrder=null;undo52=null;normalizeSettings();render52();autoSave52('undo');flash('Last action undone.');}catch(e){console.error('undo v52 failed',e);flash('Undo failed.');}}
