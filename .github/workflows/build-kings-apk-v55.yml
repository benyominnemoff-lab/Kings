          function spendAction52(){closeAction52();if(G.over){gameOver();return;}if(!G.players[G.turn].ai){G.actions--;if(G.actions<=0)endTurn52();else render52();}}
          async function doHumanAction52(skipConfirm){
            if(!G||G.over||G.players[G.turn].ai||pendingSupport||pendingWarOrder)return;
            if(typeof canDoSelectedAction==='function'&&!canDoSelectedAction()){flash((typeof eligibilityReason==='function'?eligibilityReason((q('action')||{}).value,+(q('color')||{}).value,selected.x,selected.y):'Choose a legal action.'));return;}
