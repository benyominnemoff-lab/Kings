          function applyRiverFix(){
            try{
              if(typeof BOARD==='undefined'||!BOARD.standard)return;
              const add=[3,7];   // D8: missing regular-board river connector.
              const remove=[14,2]; // O3 is not a river space.
              BOARD.standard.river=BOARD.standard.river.filter(p=>!(p[0]===remove[0]&&p[1]===remove[1]));
              if(!BOARD.standard.river.some(p=>p[0]===add[0]&&p[1]===add[1]))BOARD.standard.river.push(add);
              if(G&&G.board&&!G.settings.advanced){
                if(G.board[add[1]]&&G.board[add[1]][add[0]])G.board[add[1]][add[0]].river=true;
                if(G.board[remove[1]]&&G.board[remove[1]][remove[0]])G.board[remove[1]][remove[0]].river=false;
              }
            }catch(e){console.error('v53 river fix failed',e);}
          }
        
          function orderPlayerAt52(i){
            if(!G||!G.players)return i;
            if(G.history52&&G.history52.order&&G.history52.order[i])return G.history52.order[i].player;
            if(G.history&&G.history.order&&G.history.order[i])return G.history.order[i].player;
            let st=Number.isFinite(G.startTurn)?G.startTurn:0;return (st+i)%G.players.length;
          }
          function orderIndexOf52(p){if(!G||!G.players)return p;for(let i=0;i<G.players.length;i++)if(orderPlayerAt52(i)===p)return i;return p;}
          function roman52(i){return ['I','II','III','IV'][i]||String(i+1);}
          function displayName52(p){let pl=G.players[p];return pl?(pl.ai?pl.name:'You'):'Player';}
          function playerSymbol52(p){let pl=G.players[p];return pl?(pl.symbolName||pl.symbol||''):'Symbol';}
          function shapeIcon52(i){let s=shapeData[i]||shapeData[0];return '<span class="v52Shape '+s.cls+'" aria-hidden="true"></span>';}
          function dynastyCards52(){
            if(!G||!G.players)return '';
