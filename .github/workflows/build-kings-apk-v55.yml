            for(const s of saves){const opt=document.createElement('option');opt.value=s.id;opt.textContent=formatSave55(s);sel.appendChild(opt);}
            if(!sel.value)sel.value=saves[0].id;
            const upd=()=>{const s=getSaves55().find(x=>x.id===sel.value); if(det)det.textContent=s?formatSave55(s):'No saved match selected.'; setButtonDisabled55(['continue selected match','delete selected save'],!s); refreshInline55();};
            sel.onchange=upd; upd(); setButtonDisabled55(['continue selected match','delete selected save'],false);
          }
          function clearAllSavedMatches55(){
            const go=()=>{setSaves55([]);populateSaveSelect55();try{flash('All saved matches cleared.');}catch(_){}};
            go();
          }
          function deleteSelectedSave55(){
            const sel=q('saveSelect'); if(!sel||!sel.value){populateSaveSelect55();try{flash('Choose a saved match first.');}catch(_){}return;}
            setSaves55(getSaves55().filter(s=>s.id!==sel.value)); populateSaveSelect55(); try{flash('Selected save deleted.');}catch(_){}
          }

          function render55(){
            applyRiver55();
            let out; try{ if(typeof render54==='function')out=render54(); else if(typeof render52==='function')out=render52(); else if(typeof render==='function'&&render!==render55)out=render(); }catch(err){console.error('v55 base render failed',err);}
            try{const lg=q('log'); if(lg&&G)lg.innerHTML=historyHTML55(); const inf=q('legend'); if(inf&&G&&typeof legendHTML==='function')inf.innerHTML=legendHTML();}catch(err){console.error('v55 render extras failed',err);}
            try{repairOrderSheets55();}catch(_){}
            return out;
          }

          function patchRules55(){
            document.addEventListener('click',function(ev){
              const btn=ev.target.closest&&ev.target.closest('.v43RuleTabs button,.v42RuleTabs button,.ruleTabs button,#v40Rules button[data-rule],#v43Rules button[data-rule],[data-rule],[data-id]');
              if(!btn)return;
              setTimeout(()=>{
                const id=btn.dataset.rule||btn.dataset.id; if(!id)return;
                const target=q('v43Rule_'+id)||q('v42Rule_'+id)||q('v40Rule_'+id)||q('ruleSec_'+id);
                if(!target)return;
                const root=target.closest('#v43Rules,#v42RulesSheet,#v40Rules,#tutorialBox,.v55Sheet')||document;
                root.querySelectorAll('.v55RuleActive,.v54RuleActive,.v52RuleActive,.v51RuleActive').forEach(x=>x.classList.remove('v55RuleActive','v54RuleActive','v52RuleActive','v51RuleActive'));
                target.classList.add('v55RuleActive');
                const body=target.closest('.v43RuleBody,#v43RuleBody,#v42RuleBody,#v40RuleBody,#ruleContent')||target.parentElement;
                try{
                  const top=body.scrollTop + target.getBoundingClientRect().top - body.getBoundingClientRect().top - 4;
                  body.scrollTo({top:Math.max(0,top),behavior:'smooth'});
                }catch(_){try{target.scrollIntoView({block:'start',behavior:'smooth'});}catch(__){}}
              },130);
            },true);
          }

          function install55(){
            css55(); applyRiver55(); patchRules55();
            window.v55DynastyCards=dynastyCards55; window.v54DynastyCards=dynastyCards55; window.v52DynastyCards=dynastyCards55;
            window.showTurnOrderV44=showTurnOrder55; window.showTurnOrderSheet54=showTurnOrder55; window.showTurnOrderPopup=function(){showTurnOrder55();};
            window.startGame=startGame55; window.startGameV44=startGame55; window.startGameV48=startGame55; window.startGameV49=startGame55; window.startGameV50=startGame55; window.startGameV51=startGame55; window.startGame52=startGame55;
            window.historyHTML=historyHTML55; window.render=render55; window.runAiIfNeeded=runAiIfNeeded55; window.aiTurn=runAiTurn55;
            window.populateSaveSelect=populateSaveSelect55; window.clearAllSavedMatches=clearAllSavedMatches55; window.deleteSelectedSave=deleteSelectedSave55;
            try{showTurnOrderV44=showTurnOrder55;showTurnOrderSheet54=showTurnOrder55;startGame=startGame55;startGameV44=startGame55;historyHTML=historyHTML55;render=render55;runAiIfNeeded=runAiIfNeeded55;aiTurn=runAiTurn55;populateSaveSelect=populateSaveSelect55;clearAllSavedMatches=clearAllSavedMatches55;deleteSelectedSave=deleteSelectedSave55;}catch(_){}
            populateSaveSelect55(); if(typeof G!=='undefined'&&G)render55();
            try{new MutationObserver(()=>repairOrderSheets55()).observe(document.body,{childList:true,subtree:true,attributes:true,attributeFilter:['style','class']});}catch(_){}
          }
          if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',install55);else install55();
        })();
        </script>

        </body>
        </html>
        EOF
    - name: Download Gradle
      run: |
        curl -L -o gradle.zip https://services.gradle.org/distributions/gradle-8.7-bin.zip
        unzip -q gradle.zip
    - name: Build debug APK
      run: ./gradle-8.7/bin/gradle --no-daemon assembleDebug
    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: Kings-of-the-Two-Rivers-debug-apk
        path: app/build/outputs/apk/debug/app-debug.apk
