          function siteGrid52(){return '<div class="v52InfoGrid v52SiteGrid"><div class="v52InfoBox gold">Gold ribbon<small>treasure present</small></div><div class="v52InfoBox grey">Grey ribbon<small>treasure taken</small></div></div>';}
