        function isEligibleForCurrentAction(x,y){let a=document.getElementById('action').value, color=+document.getElementById('color').value; if(a==='tile')return legalTile(G.turn,color,x,y); if(a==='leader')return legalLeader(G.turn,color,x,y); if(a==='cat')return !playCatCheck(G.turn,x,y); if(a==='withdraw'){let c=cell(x,y);return !!(c.leader&&c.leader.p===G.turn);} return false;}
        function playCatCheck(p,x,y){let c=cell(x,y); if(c.leader||c.mon||c.wonder||c.treasure||c.building!==null)return 'Illegal catastrophe.'; if(G.players[p].cat<=0)return 'No catastrophes left.'; return null;}
        function coord(x,y){return String.fromCharCode(65+x)+(y+1)}
