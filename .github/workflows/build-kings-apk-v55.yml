            let meta=/^(Turn order:|AI level:|Enabled toggles:|Game started|MATCH BEGINS|CONTINUED SAVED MATCH|TURN START:|ROUND\s+\d+|AI plan:|AI strategy:|AI behaviour:)/i.test(t);
            if(!meta){ensureHistory52(false);if(G._histAction52)G._histAction52.lines.push(t);else{let tr=currentTurn52();if(tr)t&&tr.notes.push(t);}}
            let l=q('log');if(l)l.innerHTML=historyHTML52();
