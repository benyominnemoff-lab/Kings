        function updateQuickActions(){let box=document.getElementById('quickActions'); if(!box||!G)return; let items=contextActions(selected.x,selected.y).slice(0,4); if(!items.length){box.innerHTML='<button class="secondary" onclick="setQuickAction(\'recycleCustom\')">Recycle mix</button><button class="secondary" onclick="setQuickAction(\'replaceAll\')">Recycle all</button>';return;} box.innerHTML=items.map(it=>'<button class="'+(it.secondary?'secondary':'')+'" onclick="setQuickAction(\''+it.a+'\''+(it.c!==undefined?','+it.c:'')+')">'+it.label+'</button>').join('');}
        function contextActions(x,y){let res=[], c=inside(x,y)?cell(x,y):null; if(!G||G.players[G.turn].ai||!c)return res; for(let color=0;color<4;color++){if(legalTile(G.turn,color,x,y))res.push({a:'tile',c:color,label:'Place '+SHORT[color]+' '+TILE[color]});} for(let color=0;color<4;color++){if(legalLeader(G.turn,color,x,y))res.push({a:'leader',c:color,label:'Place '+SHORT[color]+' '+LEADER[color]});} if(c.leader&&c.leader.p===G.turn)res.unshift({a:'withdraw',label:'Withdraw leader',secondary:true}); if(!playCatCheck(G.turn,x,y))res.push({a:'cat',label:'Catastrophe',secondary:true}); return res;}
        function actionPreviewHTML(){if(!G)return ''; let a=document.getElementById('action').value, color=+document.getElementById('color').value, x=selected.x,y=selected.y, reason=eligibilityReason(a,color,x,y); let extra=''; if(a==='tile'&&inside(x,y)&&legalTile(G.turn,color,x,y)){let nk=neighborKingdomCount(x,y); if(nk===2)extra=' This is a linking tile: no placement VP; unification marker appears; war is checked.'; else if(nk===0)extra=' Isolated tile: no VP unless it later joins a kingdom.'; else extra=' If the kingdom has a matching leader, or a king if not, placement VP is awarded.'; if(G.settings.buildings&&lineCandidateGain(color,x,y)>=3)extra+=' Building line possible.'; if(G.settings.wonder&&findCrosses(x,y,color).length)extra+=' Wonder cross possible.'; if(findSquares(x,y,color).length)extra+=' Monument square possible.';} if(a==='leader'&&inside(x,y)&&legalLeader(G.turn,color,x,y)){let tmp=cell(x,y); tmp.leader={p:G.turn,color}; let co=compAt(x,y); let revolt=co&&co.leaders.filter(l=>l.color===color).length>1; tmp.leader=null; extra=revolt?' Revolt will occur: attacker commits temples first; defender wins ties.':' Leader positioning gives no VP.';} if(a==='cat')extra=' Catastrophes permanently block spaces and may split kingdoms.'; return '<b>Preview:</b> '+colorizeText(reason+extra);}
        function impactfulMoveText(a,color,x,y){if(!inside(x,y))return ''; if(a==='tile'&&legalTile(G.turn,color,x,y)){let notes=[]; if(neighborKingdomCount(x,y)===2)notes.push('This tile will unite two kingdoms. It gives no placement VP and may start war.'); if(findSquares(x,y,color).length)notes.push('This placement may create a monument choice.'); if(G.settings.wonder&&findCrosses(x,y,color).length)notes.push('This placement may create a wonder choice.'); return notes.join('\n');} if(a==='leader'&&legalLeader(G.turn,color,x,y)){let c=cell(x,y); c.leader={p:G.turn,color}; let co=compAt(x,y); let rev=co&&co.leaders.filter(l=>l.color===color).length>1; c.leader=null; return rev?'This leader placement starts a revolt.': ''; } if(a==='cat')return playCatCheck(G.turn,x,y)?'':'This catastrophe permanently blocks the space and may split kingdoms or remove leaders.'; if(a==='withdraw')return 'Withdrawing a leader can alter kingdoms and treasure access.'; return '';}
        
        function boardThemePalette(){
