          parts.push('<div class="infoBlock"><b>Sphere colours</b><div class="legendRow">'+CNAME.map((n,i)=>'<span class="pill c'+i+'"><span class="sw" style="background:'+HEX[i]+'"></span>'+n+': '+TILE[i]+' / '+LEADER[i]+' / '+VP[i]+'</span>').join('')+'</div></div>');
          parts.push('<div class="infoBlock"><b>Starting sites</b><div class="legendRow"><span class="pill">Gold ribbon = treasure still on the Shedu site</span><span class="pill">Grey ribbon = starting treasure taken/removed</span></div></div>');
