          function actionNameV51(){let a=(q('action')||{}).value,color=+(q('color')||{}).value; if(a==='tile')return 'Place '+SHORT[color]+' '+TILE[color]+' at '+coord(selected.x,selected.y); if(a==='leader')return 'Place '+SHORT[color]+' '+LEADER[color]+' at '+coord(selected.x,selected.y); if(a==='withdraw')return 'Withdraw leader at '+coord(selected.x,selected.y); if(a==='cat')return 'Catastrophe at '+coord(selected.x,selected.y); if(a==='recycleCustom')return 'Recycle chosen tile mix'; if(a==='replaceAll')return 'Recycle all tiles'; return 'Action';}
