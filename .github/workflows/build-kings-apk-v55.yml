          function actionLabel52(){let a=(q('action')||{}).value,color=+(q('color')||{}).value,x=selected.x,y=selected.y;if(a==='tile')return 'Place '+SHORT[color]+' '+TILE[color]+' at '+coord(x,y);if(a==='leader')return 'Place '+SHORT[color]+' '+LEADER[color]+' at '+coord(x,y);if(a==='withdraw')return 'Withdraw leader at '+coord(x,y);if(a==='cat')return 'Catastrophe at '+coord(x,y);if(a==='recycleCustom')return 'Recycle chosen tile mix';if(a==='replaceAll')return 'Recycle all tiles';return 'Action';}
