        function scoreEndOfTurn(p){let cps=comps(); for(const co of cps){let own=co.leaders.filter(l=>l.p===p); if(!own.length)continue; let monColors=[]; let hasWonder=false; for(const [x,y] of co.cells){let c=cell(x,y); if(c.monumentColors)monColors.push(...c.monumentColors); if(c.wonder)hasWonder=true;} for(const l of own){let gains=monColors.filter(c=>c===l.color).length; if(gains){G.players[p].vp[l.color]+=gains; log(G.players[p].name+' gains '+gains+' '+VP[l.color]+' from monument(s).');} if(l.color===BLACK&&hasWonder){let ch=chooseLowestColor(p); G.players[p].vp[ch]++; log(G.players[p].name+' gains 1 '+VP[ch]+' from the wonder.');}}}}
