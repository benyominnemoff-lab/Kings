          function runAiIfNeeded52(reason){setTimeout(()=>{try{if(!G||G.over||!G.players[G.turn]||!G.players[G.turn].ai)return;if(G.startupPhase||G.awaitingOrder||G.awaitingReview||pendingSupport||pendingWarOrder||aiBusy52||aiBusy)return;runAiTurn52(reason);}catch(e){console.error('runAiIfNeeded52 failed',reason,e);}},220);}
          async function runAiTurn52(reason){if(!G||G.over||!G.players[G.turn].ai||aiBusy52)return;aiBusy52=true;aiBusy=true;let p=G.turn;flash(displayName52(p)+' is taking its turn…');try{for(let step=0;step<2;step++){if(G.over||G.turn!==p)break;let move=null;try{move=chooseAiMove(p);}catch(e){move=null;}if(!move)move={t:'recycle',counts:(typeof recyclePlan==='function'?recyclePlan(p).counts:G.players[p].hand.map(n=>n?1:0)),v:0};if(move.x!==undefined)selected={x:move.x,y:move.y};beginAction52(p,step+1,aiActionLabel52(move));if(move.t==='tile')await placeTileAi(p,move.c,move.x,move.y);else if(move.t==='leader')await placeLeaderAi(p,move.c,move.x,move.y);else if(move.t==='cat')playCatAi(p,move.x,move.y);else if(move.t==='recycle')replaceCustomAi(p,move.counts);else log52(displayName52(p)+' could not find a useful move.');closeAction52();render52();if(pendingSupport||pendingWarOrder){aiBusy52=false;aiBusy=false;return;}await new Promise(r=>setTimeout(r,420));}aiBusy52=false;aiBusy=false;endTurn52();autoSave52('after AI turn');}catch(e){console.error('AI turn v52 failed',e);aiBusy52=false;aiBusy=false;flash('AI turn recovered after an error.');endTurn52();}}
        
