        function recyclePlan(p){let h=G.players[p].hand, v=G.players[p].vp, min=Math.min(...v), counts=[0,0,0,0], score=0, prof=aiProfile();
         let potentials=[0,1,2,3].map(c=>futureColorPotential(p,c));
