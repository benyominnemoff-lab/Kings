        function applyGameLayout(){let on=!!(G&&G.uiHorizontal); document.body.classList.toggle('horiz',on); let b=document.getElementById('layoutBtn'); if(b)b.textContent=on?'Portrait':'Landscape'; if(!activePanel)activePanel='controls'; setActivePanel(activePanel); setTimeout(()=>{resizeCanvas(); if(G)render();},120);}
        function toggleGameLayout(){if(!G)return; G.uiHorizontal=!G.uiHorizontal; G.boardZoom=1; applyGameLayout(); requestNativeOrientation(G.uiHorizontal?'landscape':'portrait'); setTimeout(()=>requestNativeOrientation(G.uiHorizontal?'sensorLandscape':'sensorPortrait'),350); flash(G.uiHorizontal?'Landscape layout.':'Portrait layout.'); setTimeout(()=>{resizeCanvas();render();},650); setTimeout(()=>{resizeCanvas();render();},1200);}
        function togglePanel(id){setActivePanel(id);}
        function centerBoard(){['controls','legend','log','menuPanel'].forEach(pid=>{let el=document.getElementById(pid); if(el)el.classList.add('collapsed');}); activePanel='board'; updateActivePanelButtons(); resetBoardZoom(); flash('Board centred and panels hidden. Tap Actions, Info, History, or Menu to reopen a panel.');}
        function resizeCanvas(){let can=board, wrap=canvasWrap; if(!wrap||!can)return; let zoom=(G&&G.boardZoom)||1, horiz=document.body.classList.contains('horiz'); let safety=horiz?8:0; let availW=Math.max(180,wrap.clientWidth-safety), availH=Math.max(130,wrap.clientHeight-safety); let fit=Math.min(availW/W,availH/H); let cellSize=Math.max(8,Math.floor(fit)); let w=W*cellSize, h=H*cellSize; can.style.width=Math.max(1,Math.floor(w*zoom))+'px'; can.style.height=Math.max(1,Math.floor(h*zoom))+'px'; wrap.classList.toggle('zoomed',zoom>1.01); if(zoom<=1.01){wrap.scrollLeft=0;wrap.scrollTop=0;} else {setTimeout(()=>{wrap.scrollLeft=Math.max(0,(can.clientWidth-wrap.clientWidth)/2);wrap.scrollTop=Math.max(0,(can.clientHeight-wrap.clientHeight)/2);},0);}}
        window.addEventListener('resize',()=>{if(G){setTimeout(()=>{resizeCanvas();render();},80);}});
        let boardDrag=null; canvasWrap.addEventListener('pointerdown',e=>{if(!G||G.boardZoom<=1.01)return; boardDrag={x:e.clientX,y:e.clientY,l:canvasWrap.scrollLeft,t:canvasWrap.scrollTop,moved:false}; canvasWrap.setPointerCapture&&canvasWrap.setPointerCapture(e.pointerId);}); canvasWrap.addEventListener('pointermove',e=>{if(!boardDrag)return; let dx=e.clientX-boardDrag.x, dy=e.clientY-boardDrag.y; if(Math.abs(dx)+Math.abs(dy)>3)boardDrag.moved=true; canvasWrap.scrollLeft=boardDrag.l-dx; canvasWrap.scrollTop=boardDrag.t-dy;}); canvasWrap.addEventListener('pointerup',()=>{setTimeout(()=>{boardDrag=null;},0);});
        board.addEventListener('click',e=>{if(boardDrag&&boardDrag.moved)return;let r=board.getBoundingClientRect(), x=Math.floor((e.clientX-r.left)/r.width*W), y=Math.floor((e.clientY-r.top)/r.height*H); if(inside(x,y)){selected={x,y}; let desc=cellDescription(x,y); if(!G.players[G.turn].ai)flash(desc+' — '+eligibilityText(x,y)); else flash(desc); render();}});
        function render(){
         if(!G)return; const can=board, ctx=can.getContext('2d'), cw=can.width/W, ch=can.height/H; ctx.clearRect(0,0,can.width,can.height);
         ctx.fillStyle=G.settings.advanced?'#c99c52':'#d7ae62'; ctx.fillRect(0,0,can.width,can.height);
         drawBoardBase(ctx,cw,ch);
         drawEligibilityOverlay(ctx,cw,ch); eachCell((c,x,y)=>drawCellContents(ctx,c,x,y,cw,ch));
         let boardAction=['tile','leader','cat','withdraw'].includes(document.getElementById('action').value); ctx.strokeStyle=(!boardAction||isEligibleForCurrentAction(selected.x,selected.y))?'#ffeb3b':'#ff5a49';ctx.lineWidth=6;ctx.strokeRect(selected.x*cw+3,selected.y*ch+3,cw-6,ch-6);
         syncRecycleInputs(); updateMiniSettings(); updateQuickActions(); renderChoiceChips(); document.getElementById('topbar').innerHTML=statusHTML(); document.getElementById('legend').innerHTML=legendHTML(); document.getElementById('eventBox').textContent=statusFlash; document.getElementById('previewBox').innerHTML=actionPreviewHTML(); document.getElementById('playerStrip').innerHTML=playerStripHTML(); document.getElementById('phaseBadge').innerHTML=phaseBadgeHTML(); document.getElementById('phaseBadge').classList.toggle('hidden',!G.settings.showPhase); document.getElementById('log').innerHTML=historyHTML(); let mp=document.getElementById('menuPanel'); let ib=mp&&mp.querySelector('#incomePreviewBox'); if(ib)ib.innerHTML=incomePreviewHTML(); let ac=document.getElementById('actionContext'); if(ac)ac.innerHTML=actionContextHTML(); updateActivePanelButtons(); updateDoActionButton();
        }
        function drawBoardBase(ctx,cw,ch){
         const pal=boardThemePalette();
         eachCell((c,x,y)=>{let px=x*cw,py=y*ch; ctx.fillStyle=c.river?pal.river:pal.land; ctx.fillRect(px,py,cw,ch); if(c.river){ctx.fillStyle=pal.riverHi; ctx.fillRect(px+cw*.08,py+ch*.08,cw*.84,ch*.84);} if(c.shedu){ctx.fillStyle=pal.shedu;ctx.fillRect(px+cw*.12,py+ch*.12,cw*.76,ch*.76);} if(c.special){ctx.strokeStyle=pal.special;ctx.lineWidth=7;ctx.strokeRect(px+6,py+6,cw-12,ch-12);ctx.strokeStyle=pal.special2;ctx.lineWidth=2.5;ctx.strokeRect(px+12,py+12,cw-24,ch-24);} ctx.strokeStyle=pal.grid;ctx.lineWidth=1.5;ctx.strokeRect(px,py,cw,ch); if(G.settings.showCoords){ctx.fillStyle='rgba(40,28,15,.55)';ctx.fillRect(px+3,py+3,Math.min(cw*.42,34),Math.min(ch*.20,18)); ctx.fillStyle='#fff5cf';ctx.font='900 '+(ch*.13)+'px Georgia';ctx.fillText(coord(x,y),px+6,py+Math.min(ch*.16,16));} });
         ctx.strokeStyle=pal.riverLine;ctx.lineWidth=Math.min(cw,ch)*.28;ctx.lineCap='round';
         eachCell((c,x,y)=>{if(!c.river)return; let cx=x*cw+cw/2,cy=y*ch+ch/2; for(const [nx,ny] of neighbors(x,y)){if(nx<x||ny<y)continue; if(cell(nx,ny).river){ctx.beginPath();ctx.moveTo(cx,cy);ctx.lineTo(nx*cw+cw/2,ny*ch+ch/2);ctx.stroke();}}});
        }
        function drawEligibilityOverlay(ctx,cw,ch){if(!G||!G.settings.showLegal||G.players[G.turn].ai||pendingSupport||pendingWarOrder)return; let a=document.getElementById('action').value; if(!['tile','leader','cat','withdraw'].includes(a))return; eachCell((c,x,y)=>{let px=x*cw,py=y*ch; if(isEligibleForCurrentAction(x,y)){ctx.fillStyle='rgba(65,170,70,.22)';ctx.fillRect(px+3,py+3,cw-6,ch-6);} }); if(!isEligibleForCurrentAction(selected.x,selected.y)){ctx.fillStyle='rgba(190,45,35,.22)';ctx.fillRect(selected.x*cw+3,selected.y*ch+3,cw-6,ch-6);}}
        function drawRoundRect(ctx,x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.quadraticCurveTo(x+w,y,x+w,y+r);ctx.lineTo(x+w,y+h-r);ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);ctx.lineTo(x+r,y+h);ctx.quadraticCurveTo(x,y+h,x,y+h-r);ctx.lineTo(x,y+r);ctx.quadraticCurveTo(x,y,x+r,y);ctx.closePath();}
        function drawSheduSiteLabel(ctx,c,px,py,cw,ch){
         ctx.save();
         ctx.fillStyle='rgba(85,60,31,.68)'; ctx.font='900 '+(ch*.17)+'px Georgia'; ctx.fillText(c.special?'Shedu★':'Shedu',px+cw*.08,py+ch*.30);
         ctx.restore();
        }
        function drawTreasureStateMarker(ctx,c,px,py,cw,ch){
         // Every Shedu starting treasure site gets the same status ribbon regardless of whether the temple is still face-up, has become a monument/wonder base, or is gone.
         // Gold means the treasure is still physically on that site; grey means that starting-site treasure has already been taken/removed.
         if(!c.treasure && !c.shedu)return;
         let isHere=!!c.treasure, isShedu=!!c.shedu;
         ctx.save();
         let w=isShedu?cw*.70:cw*.50, h=isShedu?ch*.21:ch*.20, x=px+cw*.15, y=py+ch*.72;
         if(c.face||c.wonder||c.mon){w=cw*.74;h=ch*.23;x=px+cw*.13;y=py+ch*.64;}
         ctx.fillStyle=isHere?'#f7d75a':'rgba(231,224,202,.88)';
         ctx.strokeStyle=isHere?'#5d3d08':'#6d6252'; ctx.lineWidth=isHere?3:2;
         drawRoundRect(ctx,x,y,w,h,7); ctx.fill(); ctx.stroke();
         ctx.fillStyle=isHere?'#4b3006':'#5a5146';
         ctx.textAlign='center';
         ctx.font='900 '+(isShedu?ch*.078:ch*.105)+'px Georgia';
         ctx.fillText(isHere?'TREASURE':'TAKEN',x+w/2,y+h*.62);
         if(isShedu){ctx.font='900 '+(ch*.062)+'px Georgia'; ctx.fillText('START SITE',x+w/2,y+h*.92);}
         ctx.textAlign='left'; ctx.restore();
        }
        function drawCellContents(ctx,c,x,y,cw,ch){let px=x*cw,py=y*ch;
         if(c.shedu){drawSheduSiteLabel(ctx,c,px,py,cw,ch);}
         if(c.cat){ctx.fillStyle='#704126';drawRoundRect(ctx,px+8,py+8,cw-16,ch-16,8);ctx.fill();ctx.strokeStyle='#f6dfb0';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(px+cw*.30,py+ch*.30);ctx.lineTo(px+cw*.70,py+ch*.70);ctx.moveTo(px+cw*.70,py+ch*.30);ctx.lineTo(px+cw*.30,py+ch*.70);ctx.stroke();}
         if(c.face||c.wonder){ctx.fillStyle=c.wonder?'#cdbb82':'#9a8c73';drawRoundRect(ctx,px+9,py+9,cw-18,ch-18,8);ctx.fill();ctx.fillStyle='#3e3421';ctx.font='900 '+(ch*.16)+'px Georgia';ctx.fillText(c.wonder?'Wonder':'Monument base',px+cw*.11,py+ch*.55);}
         if(c.tile!==null&&!c.face&&!c.wonder){ctx.fillStyle=HEX[c.tile];drawRoundRect(ctx,px+10,py+10,cw-20,ch-20,9);ctx.fill();ctx.strokeStyle='#fff8';ctx.lineWidth=2;ctx.stroke();ctx.fillStyle=TEXTHEX[c.tile];ctx.font='900 '+(ch*.19)+'px Georgia';ctx.textAlign='center';ctx.fillText(TILE_SHORT[c.tile],px+cw*.50,py+ch*.55);ctx.textAlign='left';}
         if(c.union!==null){ctx.fillStyle='rgba(255,250,210,.92)';drawRoundRect(ctx,px+cw*.18,py+ch*.33,cw*.64,ch*.28,6);ctx.fill();ctx.strokeStyle='#5f3b16';ctx.lineWidth=2;ctx.stroke();ctx.fillStyle='#4a2b10';ctx.font='900 '+(ch*.105)+'px Georgia';ctx.textAlign='center';ctx.fillText('UNIFY',px+cw*.50,py+ch*.51);ctx.textAlign='left';}
         if(c.monumentColors){ctx.fillStyle=HEX[c.monumentColors[0]];drawRoundRect(ctx,px+cw*.16,py+ch*.14,cw*.32,ch*.72,7);ctx.fill();ctx.fillStyle=HEX[c.monumentColors[1]];drawRoundRect(ctx,px+cw*.50,py+ch*.14,cw*.32,ch*.72,7);ctx.fill();ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.strokeRect(px+cw*.16,py+ch*.14,cw*.66,ch*.72);}
         if(c.building!==null){ctx.fillStyle='#fffbe8';drawRoundRect(ctx,px+cw*.55,py+ch*.07,cw*.40,ch*.22,5);ctx.fill();ctx.strokeStyle='#5c4322';ctx.stroke();ctx.fillStyle='#2b2117';ctx.font='900 '+(ch*.12)+'px Georgia';ctx.fillText(BUILDING[c.building].split(' ')[0],px+cw*.58,py+ch*.23);}
         if(c.shedu||c.treasure&&!c.shedu)drawTreasureStateMarker(ctx,c,px,py,cw,ch);
         if(c.leader){drawLeader(ctx,c.leader,px,py,cw,ch);}
        }
        function drawLeader(ctx,l,px,py,cw,ch){
         let r=Math.min(cw,ch)*.25, cx=px+cw*.50, cy=py+ch*.48;
         let ord=playerTurnOffset(l.p), playerBand=PLAYER_BAND[ord]||'#ffffff', owner=playerSigil(l.p), role=LEADER_SHORT[l.color].toUpperCase();
         ctx.save();ctx.translate(cx,cy);
         ctx.fillStyle='rgba(0,0,0,.22)';ctx.beginPath();ctx.ellipse(0,ch*.14,r+16,r*.36,0,0,7);ctx.fill();
