        function aiCommitSupport(p,color,base,opponent,isRevolt,isAttacker,max,needed){
         if(max<=0)return 0; let target=isAttacker?opponent+1-base:opponent-base; if(!isAttacker&&target<0)target=0; let minNeeded=Math.max(0,target); let winPossible=base+Math.min(max,minNeeded)>opponent || (!isAttacker&&base+Math.min(max,minNeeded)>=opponent); let stake=(isRevolt?2:2+colourNeed(p,color));
