        function eligibilityReason(a,color,x,y){if(!G||!inside(x,y))return 'Off board.'; let c=cell(x,y); if(a==='tile'){if(!emptyCell(c))return 'This space is occupied or blocked.'; if(color===BLUE&&!c.river)return 'Blue farms can only be placed on river spaces.'; if(color!==BLUE&&c.river)return CNAME[color]+' tiles cannot be placed on river spaces.'; if(!canAfford(G.turn,color))return 'You have no '+CNAME[color]+' tiles in hand.'; if(neighborKingdomCount(x,y)>2)return 'A tile cannot unite more than two kingdoms.'; return 'Eligible '+CNAME[color]+' tile placement.';} if(a==='leader'){if(!emptyCell(c))return 'Leaders require an empty space.'; if(c.river)return 'Leaders cannot be placed on river spaces.'; if(!neighbors(x,y).some(([nx,ny])=>faceTemple(cell(nx,ny))))return 'Leaders must be adjacent to a face-up temple.'; if(neighborKingdomCount(x,y)>1)return 'Leader placement cannot unite kingdoms.'; return 'Eligible '+CNAME[color]+' '+LEADER[color]+' placement.';} if(a==='cat'){if(G.players[G.turn].cat<=0)return 'You have no catastrophes left.'; if(c.leader)return 'Catastrophes cannot be played on leaders.'; if(c.mon||c.wonder||c.treasure)return 'Catastrophes cannot be played on treasures, monuments, or the wonder.'; if(c.building!==null)return 'Catastrophes cannot be played on a tile under a civilisation building; that tile is protected.'; return 'Eligible catastrophe placement.';} if(a==='withdraw'){return (c.leader&&c.leader.p===G.turn)?'Eligible: withdraw this leader.':'Select one of your own leaders to withdraw.';} if(a==='recycleCustom')return 'Set the tile counts below, then recycle that exact mix.'; return 'This action does not use a board placement.';}
