          if(G.players[p].hand[c]>0){for(let y=0;y<H;y++)for(let x=0;x<W;x++)if(legalTile(p,c,x,y)){let v=evaluateTile(p,c,x,y); if(v>-25)moves.push({t:'tile',c,x,y,v});}}
