            for(let r=maxRound;r>=1;r--){
              html+='<div class="v52HistRound">Round '+esc(r)+'</div>';
              let arr=turns.filter(t=>(t.round||1)===r).slice().reverse();
              for(const t of arr){let oi=orderIndexOf52(t.player);html+='<div class="v52HistTurn"><b>'+esc(roman52(oi)+' · '+displayName52(t.player))+'</b>';let acts=(t.actions||[]).slice().sort((a,b)=>b.no-a.no);for(const a of acts){let lines=a.lines&&a.lines.length?a.lines:[a.label||'Action completed.'];html+='<span class="v52HistAction"><span class="actNo">Action '+esc(a.no)+':</span> '+(typeof colorizeText==='function'?colorizeText(lines[0]):esc(lines[0]))+'</span>';for(const l of lines.slice(1))html+='<span class="v52HistDetail">'+(typeof colorizeText==='function'?colorizeText(l):esc(l))+'</span>';}for(const n of (t.notes||[]))html+='<span class="v52HistDetail">'+(typeof colorizeText==='function'?colorizeText(n):esc(n))+'</span>';html+='</div>';}
            }
