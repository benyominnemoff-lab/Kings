        function hardRecommendations(p,limit=4){let old=G.aiLevel; G.aiLevel='hard'; let moves=aiCandidates(p); G.aiLevel=old; return moves.slice(0,limit).map((m,i)=>(i+1)+'. '+moveLabel(m));}
        function finishHumanTurn(){if(pendingSupport||pendingWarOrder){flash('Resolve the current war/support choice first.');return;} if(!G.players[G.turn].ai){ if(G.actions>0){let recs=hardRecommendations(G.turn,5); let checklist=endTurnChecklist(); let msg='End-turn checklist:\n'+checklist+'\n\nYou still have '+G.actions+' action'+(G.actions===1?'':'s')+' available. Strong options include:\n\n'+(recs.length?recs.join('\n'):'No clearly useful action found; recycling tiles may still be worth considering.')+'\n\nTap OK only if you explicitly do not care and want to end the turn anyway. Tap Cancel to keep playing.'; if(!confirm(msg)){flash('Turn not ended. Choose an action or tap Finish turn again and confirm.'); return;} log('You explicitly chose to end the turn with '+G.actions+' unused action'+(G.actions===1?'':'s')+'.'); } endTurn();}}
        function aiTurn(){if(G.over||!G.players[G.turn].ai||aiBusy)return; let p=G.turn; aiBusy=true; flash(G.players[p].name+' is thinking…'); runAiStep(p,0);}
        function runAiStep(p,step){ if(G.over||G.turn!==p){aiBusy=false; return;} if(step>=2){flash(G.players[p].name+' ends the turn.'); aiBusy=false; setTimeout(()=>endTurn(),AI_PACE.end); return;} let move=chooseAiMove(p); if(!move){move={t:'recycle',counts:recyclePlan(p).counts,v:0};} if(move.x!==undefined)selected={x:move.x,y:move.y}; render(); let dest=(move.x!==undefined&&move.y!==undefined)?(' at '+coord(move.x,move.y)):''; flash(G.players[p].name+' is considering '+moveLabel(move)+dest+'.'); setTimeout(async()=>{ if(move.t==='tile')await placeTileAi(p,move.c,move.x,move.y); else if(move.t==='leader')await placeLeaderAi(p,move.c,move.x,move.y); else if(move.t==='cat')playCatAi(p,move.x,move.y); else if(move.t==='recycle')replaceCustomAi(p,move.counts); render(); setTimeout(()=>runAiStep(p,step+1),AI_PACE.between); },AI_PACE.plan); }
        function moveLabel(m){if(!m)return 'none'; if(m.t==='tile')return 'place '+CNAME[m.c]+' '+TILE[m.c]+' at '+coord(m.x,m.y); if(m.t==='leader')return 'place '+CNAME[m.c]+' '+LEADER[m.c]+' at '+coord(m.x,m.y); if(m.t==='cat')return 'catastrophe at '+coord(m.x,m.y); if(m.t==='recycle')return 'recycle '+m.counts.map((n,i)=>n?CNAME[i]+' '+n:null).filter(Boolean).join(', '); return m.t;}
        function chooseAiMove(p){let moves=aiCandidates(p); if(!moves.length)return null; let prof=aiProfile(); if(G.aiLevel==='hard')return moves[0]; if(G.aiLevel==='regular'){let pool=moves.filter(m=>m.v>=moves[0].v-2.0).slice(0,prof.top); return weightedMove(pool,.75);} let safe=moves.filter(m=>m.v>0); let pool=(safe.length?safe:moves).slice(0,prof.top); if(Math.random()<prof.mistake&&pool.length>2)return pool[Math.floor(Math.random()*pool.length)]; return weightedMove(pool,.45);}
        function weightedMove(pool,temp){let min=Math.min(...pool.map(m=>m.v)), weights=pool.map(m=>Math.exp((m.v-min)/Math.max(.2,2.5/temp))), total=weights.reduce((a,b)=>a+b,0), r=Math.random()*total; for(let i=0;i<pool.length;i++){r-=weights[i]; if(r<=0)return pool[i];} return pool[0];}
        function evaluateTile(p,c,x,y,quiet){
         let v=0, pl=G.players[p], need=colourNeed(p,c), beforeUnite=neighborKingdomCount(x,y)===2, rival=mainRival(p), prof=aiProfile();
         let tmp=cell(x,y), oldTile=tmp.tile; tmp.tile=c; let co=compAt(x,y); let holder=null;
         if(beforeUnite)v+=G.aiLevel==='hard'?0.2:0.45;
         if(co){
          holder=co.leaders.find(l=>l.color===c)||co.leaders.find(l=>l.color===BLACK);
          if(holder&&holder.p===p){let reward=1+(G.settings.buildings&&compHasBuilding(co,c)?1:0); v+=5.8*reward+need*1.1;}
          else if(holder&&holder.p!==p){let penalty=(5.8+colourNeed(holder.p,c)*0.75)*prof.helpPenalty; if(holder.p===rival)penalty+=2.2; v-=penalty;}
          else v-=.6;
