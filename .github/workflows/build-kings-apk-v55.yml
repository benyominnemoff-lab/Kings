            let rec={round:G.round||1,player:p,actions:[],notes:[]};G.history52.turns.push(rec);return rec;
          }
          function beginAction52(p,no,label){ensureHistory52(false);let rec=currentTurn52();if(!rec||rec.player!==p||rec.round!==(G.round||1))rec=startTurn52(p);let act={no:no,lines:[],label:label||'Action'};rec.actions.push(act);G._histAction52=act;return act;}
          function closeAction52(){if(G)G._histAction52=null;}
