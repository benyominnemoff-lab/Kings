          function applyRiver55(){
            try{
              if(typeof BOARD==='undefined'||!BOARD.standard)return;
              const d8=[3,7], o3=[14,2];
              BOARD.standard.river=BOARD.standard.river.filter(p=>!(p[0]===o3[0]&&p[1]===o3[1]));
              if(!BOARD.standard.river.some(p=>p[0]===d8[0]&&p[1]===d8[1])) BOARD.standard.river.push(d8);
              if(typeof G!=='undefined'&&G&&G.board&&!G.settings.advanced){
                if(G.board[d8[1]]&&G.board[d8[1]][d8[0]])G.board[d8[1]][d8[0]].river=true;
                if(G.board[o3[1]]&&G.board[o3[1]][o3[0]])G.board[o3[1]][o3[0]].river=false;
              }
            }catch(err){console.error('v55 river fix failed',err);}
          }

          function orderPlayer55(i){
            if(typeof G==='undefined'||!G||!G.players)return i;
            if(G.history55&&G.history55.order&&G.history55.order[i])return G.history55.order[i].player;
            if(G.history52&&G.history52.order&&G.history52.order[i])return G.history52.order[i].player;
            const st=Number.isFinite(G.startTurn)?G.startTurn:(G.turn||0);
            return (st+i)%G.players.length;
          }
          function orderIndex55(p){if(typeof G==='undefined'||!G||!G.players)return p;for(let i=0;i<G.players.length;i++)if(orderPlayer55(i)===p)return i;return p;}
          function roman55(i){return ['I','II','III','IV'][i]||String(i+1);}
          function playerSymbol55(p){let pl=G&&G.players&&G.players[p];return pl?(pl.symbolName||pl.symbol||''):'';}
          function displayName55(p){let pl=G&&G.players&&G.players[p];if(!pl)return 'Player';if(!pl.ai)return 'You';return (playerSymbol55(p)||pl.name||'AI')+' AI';}
          function shapeInline55(i){let s=SHAPES55[i]||SHAPES55[0];return '<span class="v55Shape" aria-label="'+esc(s.name)+' outline">'+esc(s.glyph)+'</span>';}
          function dynastyCards55(){
            if(typeof G==='undefined'||!G||!G.players)return '';
            let html='<div class="v55DynGrid">';
            for(let i=0;i<G.players.length;i++){
              const p=orderPlayer55(i),pl=G.players[p]||{},s=SHAPES55[i]||SHAPES55[0];
              const line2=(pl.ai?'':(esc(playerSymbol55(p))+' · '))+esc(s.name)+' '+shapeInline55(i);
              html+='<div class="v55DynCard" style="background:'+BG55[i]+';color:'+FG55[i]+'"><div class="v55DynTop">'+esc(roman55(i)+' · '+displayName55(p))+'</div><div class="v55DynSub">'+line2+'</div></div>';
            }
            return html+'</div>';
          }

          function ensureHist55(){
            if(typeof G==='undefined'||!G)return {turns:[],order:[]};
            if(!G.history55)G.history55={order:[],turns:[]};
            if(!G.history55.order||!G.history55.order.length){
              G.history55.order=[];
              for(let i=0;i<G.players.length;i++)G.history55.order.push({order:i,player:orderPlayer55(i)});
            }
            if(!Array.isArray(G.history55.turns))G.history55.turns=[];
            if(G.history52&&Array.isArray(G.history52.turns)){
              for(const t of G.history52.turns){
                if(!t||!Array.isArray(t.actions))continue;
                const exists=G.history55.turns.some(u=>u._src===t|| (u.player===t.player&&u.round===t.round&&JSON.stringify(u.actions)===JSON.stringify(t.actions)));
                if(!exists)G.history55.turns.push({round:t.round||1,player:t.player,actions:(t.actions||[]).map(a=>({no:Number(a.no)||1,lines:(a.lines&&a.lines.length?a.lines.slice():[a.label||'Action completed.'])})),notes:(t.notes||[]).slice(),_src:t});
              }
            }
            return G.history55;
          }
          function startTurn55(p){
            const h=ensureHist55(),r=G.round||1;
            let rec=h.turns[h.turns.length-1];
            if(rec&&rec.player===p&&rec.round===r)return rec;
            rec={round:r,player:p,actions:[],notes:[]};h.turns.push(rec);return rec;
          }
          function beginAction55(p,no,label){
            const rec=startTurn55(p);
            let act=rec.actions.find(a=>a.no===no);
            if(!act){act={no,lines:[]};rec.actions.push(act);}
            if(label&&!act.lines.length)act.lines.push(label);
            G._histAction52=act;
            return act;
          }
          function closeAction55(){if(G)G._histAction52=null;}
          function isMeta55(x){return /^(Turn order:|AI level:|Enabled toggles:|Game started|MATCH BEGINS|CONTINUED SAVED MATCH|TURN START:|ROUND\s+\d+|AI plan:|AI strategy:|AI behaviour:|AI can |AI will |AI goal|Starting player:)/i.test(String(x||''));}
          function cleanLines55(lines,label){let out=(lines||[]).filter(x=>x&&!isMeta55(x)); if(!out.length&&label)out=[label]; return out;}
          function fmt55(s){try{return typeof colorizeText==='function'?colorizeText(String(s)):esc(s);}catch(_){return esc(s);}}
          function historyHTML55(){
            if(typeof G==='undefined'||!G)return '';
            const h=ensureHist55();
            let turns=(h.turns||[]).filter(t=>t&&Array.isArray(t.actions)&&t.actions.some(a=>cleanLines55(a.lines,a.label).length));
            const maxRound=Math.max(G.round||1,...turns.map(t=>Number(t.round)||1),1);
            let html='';
            for(let r=maxRound;r>=1;r--){
              const arr=turns.filter(t=>(Number(t.round)||1)===r);
              if(arr.length||r===1||r===maxRound)html+='<div class="v55HistRound">Round '+esc(r)+'</div>';
              // newer turn groups first; if order index is larger, it occurred later in the round
              arr.sort((a,b)=>orderIndex55(b.player)-orderIndex55(a.player));
              for(const t of arr){
                const oi=orderIndex55(t.player);
                html+='<div class="v55HistTurn"><b>'+esc(roman55(oi)+' · '+displayName55(t.player))+'</b>';
                const acts=(t.actions||[]).slice().sort((a,b)=>(Number(b.no)||0)-(Number(a.no)||0));
                for(const a of acts){
                  const lines=cleanLines55(a.lines,a.label||'Action completed.');
                  if(!lines.length)continue;
                  html+='<span class="v55HistAction"><span class="actNo">Action '+esc(a.no)+':</span> '+fmt55(lines[0])+'</span>';
                  for(const l of lines.slice(1))html+='<span class="v55HistDetail">'+fmt55(l)+'</span>';
                }
                for(const n of (t.notes||[]).filter(x=>!isMeta55(x)))html+='<span class="v55HistDetail">'+fmt55(n)+'</span>';
                html+='</div>';
              }
            }
            html+='<div class="v55HistOrder"><b>Turn order</b>'+dynastyCards55()+'</div>';
            return html;
          }

          function aiLabel55(m){
            if(!m)return 'AI action';
            try{
              if(m.t==='tile')return 'placed '+CNAME[m.c]+' '+TILE[m.c]+' at '+coord(m.x,m.y)+'.';
              if(m.t==='leader')return 'positioned '+CNAME[m.c]+' '+LEADER[m.c]+' at '+coord(m.x,m.y)+'.';
              if(m.t==='cat')return 'played catastrophe at '+coord(m.x,m.y)+'.';
              if(m.t==='recycle')return 'recycled tiles.';
            }catch(_){}
            return 'completed an action.';
          }
          function runAiIfNeeded55(reason){
            setTimeout(()=>{try{
              if(typeof G==='undefined'||!G||G.over||!G.players[G.turn]||!G.players[G.turn].ai)return;
              if(G.startupPhase||G.awaitingOrder||G.awaitingReview||typeof pendingSupport!=='undefined'&&pendingSupport||typeof pendingWarOrder!=='undefined'&&pendingWarOrder||aiBusy55)return;
              runAiTurn55(reason);
            }catch(err){console.error('v55 runAiIfNeeded failed',reason,err);}},220);
          }
          async function runAiTurn55(reason){
            if(typeof G==='undefined'||!G||G.over||!G.players[G.turn]||!G.players[G.turn].ai||aiBusy55)return;
            aiBusy55=true; try{aiBusy=true;}catch(_){}
            const p=G.turn; startTurn55(p);
            try{
              for(let step=0;step<2;step++){
                if(!G||G.over||G.turn!==p)break;
                let move=null; try{move=chooseAiMove(p);}catch(_){}
                if(!move){
                  let counts=[0,0,0,0]; try{counts=(typeof recyclePlan==='function'?recyclePlan(p).counts:G.players[p].hand.map(n=>n?1:0));}catch(_){}
                  move={t:'recycle',counts,v:0};
                }
                if(move.x!==undefined)selected={x:move.x,y:move.y};
                const act=beginAction55(p,step+1,aiLabel55(move));
                try{
                  if(move.t==='tile')await placeTileAi(p,move.c,move.x,move.y);
                  else if(move.t==='leader')await placeLeaderAi(p,move.c,move.x,move.y);
                  else if(move.t==='cat')playCatAi(p,move.x,move.y);
                  else if(move.t==='recycle')replaceCustomAi(p,move.counts);
                  else act.lines.push('could not find a useful move.');
                }catch(err){act.lines.push('AI action recovered after an error.'); console.error('v55 AI action failed',err);}
                closeAction55();
                try{render55();}catch(_){}
                if((typeof pendingSupport!=='undefined'&&pendingSupport)||(typeof pendingWarOrder!=='undefined'&&pendingWarOrder)){aiBusy55=false;try{aiBusy=false;}catch(_){} return;}
                await new Promise(r=>setTimeout(r,420));
              }
              aiBusy55=false; try{aiBusy=false;}catch(_){}
              try{endTurn();}catch(err){console.error('v55 AI endTurn failed',err);}
              try{autoSave&&autoSave('after AI turn');}catch(_){}
            }catch(err){
              console.error('v55 AI turn failed',err); aiBusy55=false; try{aiBusy=false;}catch(_){}
              try{endTurn();}catch(_){}
            }
          }

          function showTurnOrder55(){
            css55(); applyRiver55();
            let el=q('v55TurnOrderSheet')||q('v54TurnOrderSheet')||q('v44OrderSheet')||q('turnOrderModal');
            if(!el){el=document.createElement('div');el.id='v55TurnOrderSheet';el.className='v55Sheet';document.body.appendChild(el);}
