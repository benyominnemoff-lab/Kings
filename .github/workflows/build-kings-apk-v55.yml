        </style>
        
        <style id="v46Style">
        /* v46 final UI correctness pass */
        .v43Select,.v43SelectBtn,.v43SelectList,.v43SelectOpt,
        #setup select,#setup button,#setup .card,#setup .check,#setup .pillToggle,
        .v45DynBubble,.v46DynBubble,.v46OrderBubble{box-shadow:none!important;text-shadow:none!important;filter:none!important;}
        .v43SelectList{box-shadow:none!important;border:1px solid #b99048!important;background:#fff6dc!important;}
        .v43SelectOpt,.v43SelectBtn{font-family:var(--head)!important;font-size:13px!important;text-shadow:none!important;box-shadow:none!important;background:#fff7df!important;color:#33200f!important;}
        .v43SelectOpt.active,.v43SelectOpt:hover{background:#ecd08e!important;color:#2f1d0c!important;}
        .v46DynGrid{display:grid!important;grid-template-columns:repeat(2,minmax(0,1fr))!important;gap:6px!important;margin-top:7px!important;}
        .v46DynBubble,.v46OrderBubble{border:1px solid rgba(53,31,13,.35)!important;border-radius:12px!important;padding:5px 7px!important;min-height:0!important;line-height:1.05!important;font-family:var(--head)!important;overflow:hidden!important;}
        .v46DynBubble .top,.v46OrderBubble .top{display:block!important;font-size:11.2px!important;font-weight:950!important;white-space:nowrap!important;overflow:hidden!important;text-overflow:ellipsis!important;}
        .v46DynBubble .sub,.v46OrderBubble .sub{display:block!important;font-size:9.3px!important;margin-top:2px!important;white-space:nowrap!important;overflow:hidden!important;text-overflow:ellipsis!important;}
        .v46DynBubble.p0,.v46OrderBubble.p0{background:#f3c644!important;color:#1f1706!important}.v46DynBubble.p1,.v46OrderBubble.p1{background:#8b5a2b!important;color:#fff4df!important}.v46DynBubble.p2,.v46OrderBubble.p2{background:#d985ad!important;color:#260917!important}.v46DynBubble.p3,.v46OrderBubble.p3{background:#7d5fc0!important;color:#fff!important}
        .v46OrderGrid{display:grid!important;grid-template-columns:repeat(2,minmax(0,1fr))!important;gap:6px!important;margin:9px 0!important;}
        #turnOrderModal .orderCard,.v46TurnOrderCard{font-family:var(--head)!important;font-size:12px!important;line-height:1.15!important;}
        #turnOrderModal .orderCard h2,.v46TurnOrderCard h2{font-family:var(--display)!important;font-size:18px!important;line-height:1.05!important;margin:0 0 7px!important;}
        .v46SphereGrid{display:grid!important;grid-template-columns:repeat(2,minmax(0,1fr))!important;gap:6px!important;margin-top:6px!important;}
        .v46Sphere{border-radius:12px!important;border:1px solid rgba(55,32,14,.35)!important;padding:6px 8px!important;font-family:var(--head)!important;font-weight:900!important;font-size:11px!important;line-height:1.14!important;box-shadow:none!important;text-shadow:none!important;}
        .v46Sphere small{display:block;font-size:9.5px!important;font-weight:800!important;margin-top:2px!important;}
        .v46Sphere.s0{background:#222!important;color:#fff7df!important}.v46Sphere.s1{background:#b54134!important;color:#fff7df!important}.v46Sphere.s2{background:#2d70a4!important;color:#fff!important}.v46Sphere.s3{background:#3f8645!important;color:#fff!important}
        .v46RuleActive{outline:3px solid #7b4f25!important;outline-offset:3px!important;background:#fff9df!important;transition:outline-color .25s, background .25s!important;}
        .v45RibbonKey.gold,.v46RibbonGold{background:#d7b354!important;color:#2c1b08!important;border-color:#8a6510!important}.v45RibbonKey.grey,.v46RibbonGrey{background:#9d9a92!important;color:#fff!important;border-color:#5d5a54!important}
        @media (orientation:portrait){.v46OrderGrid{grid-template-columns:1fr!important}.v46DynGrid{grid-template-columns:repeat(2,minmax(0,1fr))!important}}
