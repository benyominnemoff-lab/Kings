        }
        function evaluateLeader(p,c,x,y){
         let v=1.1+colourNeed(p,c)*1.1, old=G.players[p].leaders[c], oldCell=null, prof=aiProfile(), rival=mainRival(p);
         if(old){oldCell=cell(old.x,old.y); oldCell.leader=null; v-=0.9;} else v+=1.25;
         let tmp=cell(x,y); tmp.leader={p,color:c}; let co=compAt(x,y);
         if(co){
          let treasures=compTreasures(co), ownOther=co.leaders.filter(l=>l.p===p&&l.color!==c).length, enemySame=co.leaders.find(l=>l.p!==p&&l.color===c);
          if(c===GREEN)v+=treasures*4.2; else if(treasures>1)v+=treasures*.75;
          if(enemySame){let odds=revoltForecast(p,c,x,y); v+=odds; if(enemySame.p===rival&&odds>0)v+=1.4;}
          if(ownOther)v+=1.2+ownOther*.35;
          v+=Math.min(3.2,co.cells.length/7);
          if(c===BLACK){let missingColors=[1,2,3].filter(col=>!co.leaders.some(l=>l.color===col)); v+=missingColors.length*.45;}
          if(c!==BLACK&&!co.leaders.some(l=>l.color===c&&l.p!==p))v+=.75;
          if(co.leaders.some(l=>l.p!==p&&l.p===rival))v+=.4;
         }
         tmp.leader=null; if(oldCell)oldCell.leader={p,color:c};
         return v + Math.random()*prof.noise;
        }
        function lineCandidateGain(color,x,y){let best=0; for(const dir of [[1,0],[0,1]]){let n=1; for(const s of [-1,1]){let nx=x+dir[0]*s,ny=y+dir[1]*s; while(inside(nx,ny)&&cell(nx,ny).tile===color&&!cell(nx,ny).face&&!cell(nx,ny).wonder){n++; nx+=dir[0]*s; ny+=dir[1]*s;}} best=Math.max(best,n);} return best>=3?best:0;}
        function revoltForecast(p,c,x,y){let co=compAt(x,y); if(!co)return 0; let def=co.leaders.find(l=>l.color===c&&l.p!==p); if(!def)return 0; let aBase=neighbors(x,y).filter(([nx,ny])=>faceTemple(cell(nx,ny))).length, dBase=neighbors(def.x,def.y).filter(([nx,ny])=>faceTemple(cell(nx,ny))).length; let aMax=aBase+G.players[p].hand[RED], dMax=dBase+G.players[def.p].hand[RED], value=2+colourNeed(p,RED); if(aBase>dMax)return 5+value*.4; if(aMax<=dBase)return -13; let cost=Math.max(0,dBase+1-aBase); return aMax>dMax?(3.2+value*.25-cost*.35):(-3.2-cost*.3);}
        function expectedWarRewardForLoser(loser,color,block){return 1+countSupport(loser.x,loser.y,color,block);}
        function warForecast(p,c,x,y){let co=compAt(x,y); if(!co)return 0; let score=0, block=key(x,y), rival=mainRival(p); for(let col=0;col<4;col++){let ls=co.leaders.filter(l=>l.color===col); if(ls.length<2)continue; let own=ls.find(l=>l.p===p), enemies=ls.filter(l=>l.p!==p); if(!own){score-=2.8*enemies.length; continue;} let enemy=enemies.sort((a,b)=>(b.p===rival)-(a.p===rival))[0]; let ownStr=countSupport(own.x,own.y,col,block)+G.players[p].hand[col], enStr=countSupport(enemy.x,enemy.y,col,block)+G.players[enemy.p].hand[col]; let reward=expectedWarRewardForLoser(enemy,col,block)+colourNeed(p,col)*.4; if(ownStr>enStr)score+=4.5+reward*.7; else if(ownStr===enStr)score-=3.0; else score-=8.5+(enemy.p===rival?1.5:0); } return score;}
        function evaluateCat(p,x,y){let c=cell(x,y); if(c.leader||c.mon||c.wonder||c.treasure||c.building!==null||G.players[p].cat<=0)return null; if(c.tile===null&&!c.face)return null; let co=compAt(x,y), score=0, rival=mainRival(p); if(!co)return null; let own=co.leaders.filter(l=>l.p===p).length, enemy=co.leaders.filter(l=>l.p!==p).length; if(!enemy&&own)return -10; score+=(enemy-own)*1.9; if(c.tile===RED){for(const [nx,ny] of neighbors(x,y)){let l=cell(nx,ny).leader; if(!l)continue; let otherTemple=neighbors(nx,ny).some(([tx,ty])=>!(tx===x&&ty===y)&&faceTemple(cell(tx,ty))); if(!otherTemple)score += l.p===p?-25:(l.p===rival?15:11);}}
