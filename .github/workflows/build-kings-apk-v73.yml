          if(c===RED&&co.leaders.some(l=>l.p===p))v+=.75; // temples preserve leader options
         }
         if(findSquares(x,y,c).length)v+=G.settings.buildings?5.2:4.3;
         if(G.settings.wonder&&findCross(x,y,c))v+=6.3+colourNeed(p,BLACK)*.4;
