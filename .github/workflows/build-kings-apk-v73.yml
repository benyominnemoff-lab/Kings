        function setUiOption(k,v){if(!G)return; G.settings[k]=v; applyAccessibility(); if(k==='confirmImpact')flash('Move confirmation '+(v?'enabled':'disabled')+'.'); render();}
        function updateMiniSettings(){if(!G)return; const m=[['uiConfirm','confirmImpact'],['uiConfirm2','confirmImpact'],['uiLegal','showLegal'],['uiLegal2','showLegal'],['uiPhase','showPhase']]; for(const [id,k] of m){let el=document.getElementById(id); if(el)el.checked=!!G.settings[k];} applyAccessibility();}
        function setQuickAction(a,c){setActionChoice(a); if(c!==undefined)setColorChoice(c); refreshEligibilityMessage();}
        function setActionChoice(a){let el=document.getElementById('action'); if(el)el.value=a; renderChoiceChips(); syncRecycleInputs();}
        function setColorChoice(c){let el=document.getElementById('color'); if(el)el.value=String(c); renderChoiceChips();}
        function renderChoiceChips(){
        let aSel=document.getElementById('action'), cSel=document.getElementById('color');
        let aBox=document.getElementById('actionChips'), cBox=document.getElementById('colorChips');
        if(aBox&&aSel){let opts=[['tile','Tile'],['leader','Leader'],['withdraw','Withdraw'],['cat','Catastrophe'],['recycleCustom','Recycle mix'],['replaceAll','Recycle all']]; aBox.innerHTML=opts.map(o=>'<button class="chipBtn '+(aSel.value===o[0]?'active':'')+'" onclick="setActionChoice(\''+o[0]+'\');refreshEligibilityMessage()">'+o[1]+'</button>').join('');}
        if(cBox&&cSel){cBox.innerHTML=CNAME.map((n,i)=>'<button class="chipBtn c'+i+' '+(+cSel.value===i?'active':'')+'" onclick="setColorChoice('+i+');refreshEligibilityMessage()">'+SHORT[i]+'</button>').join('');}
        }
        function updateQuickActions(){let box=document.getElementById('quickActions'); if(!box||!G)return; let items=contextActions(selected.x,selected.y).slice(0,4); if(!items.length){box.innerHTML='<button class="secondary" onclick="setQuickAction(\'recycleCustom\')">Recycle mix</button><button class="secondary" onclick="setQuickAction(\'replaceAll\')">Recycle all</button>';return;} box.innerHTML=items.map(it=>'<button class="'+(it.secondary?'secondary':'')+'" onclick="setQuickAction(\''+it.a+'\''+(it.c!==undefined?','+it.c:'')+')">'+it.label+'</button>').join('');}
        function contextActions(x,y){let res=[], c=inside(x,y)?cell(x,y):null; if(!G||G.players[G.turn].ai||!c)return res; for(let color=0;color<4;color++){if(legalTile(G.turn,color,x,y))res.push({a:'tile',c:color,label:'Place '+SHORT[color]+' '+TILE[color]});} for(let color=0;color<4;color++){if(legalLeader(G.turn,color,x,y))res.push({a:'leader',c:color,label:'Place '+SHORT[color]+' '+LEADER[color]});} if(c.leader&&c.leader.p===G.turn)res.unshift({a:'withdraw',label:'Withdraw leader',secondary:true}); if(!playCatCheck(G.turn,x,y))res.push({a:'cat',label:'Catastrophe',secondary:true}); return res;}
        function actionPreviewHTML(){if(!G)return ''; let a=document.getElementById('action').value, color=+document.getElementById('color').value, x=selected.x,y=selected.y, reason=eligibilityReason(a,color,x,y); let extra=''; if(a==='tile'&&inside(x,y)&&legalTile(G.turn,color,x,y)){let nk=neighborKingdomCount(x,y); if(nk===2)extra=' This is a linking tile: no placement VP; unification marker appears; war is checked.'; else if(nk===0)extra=' Isolated tile: no VP unless it later joins a kingdom.'; else extra=' If the kingdom has a matching leader, or a king if not, placement VP is awarded.'; if(G.settings.buildings&&lineCandidateGain(color,x,y)>=3)extra+=' Building line possible.'; if(G.settings.wonder&&findCrosses(x,y,color).length)extra+=' Wonder cross possible.'; if(findSquares(x,y,color).length)extra+=' Monument square possible.';} if(a==='leader'&&inside(x,y)&&legalLeader(G.turn,color,x,y)){let tmp=cell(x,y); tmp.leader={p:G.turn,color}; let co=compAt(x,y); let revolt=co&&co.leaders.filter(l=>l.color===color).length>1; tmp.leader=null; extra=revolt?' Revolt will occur: attacker commits temples first; defender wins ties.':' Leader positioning gives no VP.';} if(a==='cat')extra=' Catastrophes permanently block spaces and may split kingdoms.'; return '<b>Preview:</b> '+colorizeText(reason+extra);}
        function impactfulMoveText(a,color,x,y){if(!inside(x,y))return ''; if(a==='tile'&&legalTile(G.turn,color,x,y)){let notes=[]; if(neighborKingdomCount(x,y)===2)notes.push('This tile will unite two kingdoms. It gives no placement VP and may start war.'); if(findSquares(x,y,color).length)notes.push('This placement may create a monument choice.'); if(G.settings.wonder&&findCrosses(x,y,color).length)notes.push('This placement may create a wonder choice.'); return notes.join('\n');} if(a==='leader'&&legalLeader(G.turn,color,x,y)){let c=cell(x,y); c.leader={p:G.turn,color}; let co=compAt(x,y); let rev=co&&co.leaders.filter(l=>l.color===color).length>1; c.leader=null; return rev?'This leader placement starts a revolt.': ''; } if(a==='cat')return playCatCheck(G.turn,x,y)?'':'This catastrophe permanently blocks the space and may split kingdoms or remove leaders.'; if(a==='withdraw')return 'Withdrawing a leader can alter kingdoms and treasure access.'; return '';}
        
        function boardThemePalette(){
          let t=(G&&G.ui&&G.ui.theme)||localStorage.getItem('kingsTheme')||'classic';
          if(t==='muted')return {land:'#c9ad69',river:'#7aa5b7',riverHi:'rgba(255,255,255,.12)',shedu:'rgba(245,229,176,.28)',special:'#d7bd66',special2:'#755117',grid:'rgba(72,55,31,.50)',riverLine:'rgba(38,91,112,.45)'};
          if(t==='contrast')return {land:'#f1ca62',river:'#4fb6e6',riverHi:'rgba(255,255,255,.30)',shedu:'rgba(255,255,210,.50)',special:'#ffff4d',special2:'#000000',grid:'rgba(0,0,0,.85)',riverLine:'rgba(0,57,116,.78)'};
          return {land:'#d9b56c',river:'#7db8d7',riverHi:'rgba(255,255,255,.18)',shedu:'rgba(250,238,190,.35)',special:'#ffe483',special2:'#8a5b10',grid:'rgba(84,63,32,.65)',riverLine:'rgba(20,92,132,.55)'};
        }
        function legendHTML(){
          if(!G)return '';
          let parts=[];
          parts.push(selectedSpaceCardHTML());
          parts.push('<div class="infoBlock"><b>Turn order / dynasties</b><div class="legendRow">'+G.players.map((pl,i)=>'<span class="pill ownerP'+i+'"><b>'+playerMark(i)+'</b> '+esc(pl.name)+' · '+esc(pl.symbol||SIGIL[i]||'')+'</span>').join('')+'</div></div>');
          parts.push('<div class="infoBlock"><b>Sphere colours</b><div class="legendRow">'+CNAME.map((n,i)=>'<span class="pill c'+i+'"><span class="sw" style="background:'+HEX[i]+'"></span>'+n+': '+TILE[i]+' / '+LEADER[i]+' / '+VP[i]+'</span>').join('')+'</div></div>');
          parts.push('<div class="infoBlock"><b>Starting sites</b><div class="legendRow"><span class="pill">Gold ribbon = treasure still on the Shedu site</span><span class="pill">Grey ribbon = starting treasure taken/removed</span></div></div>');
          /* v65: civilisation buildings section intentionally omitted from Info panel. */
          parts.push('<div class="infoBlock tiny">Board theme is in Menu. Themes recolour the board only; player frames remain separate from sphere colours.</div>');
          return parts.join('');
        }
        function selectedSpaceCardHTML(){let desc=describeCell(selected.x,selected.y); let c=cell(selected.x,selected.y); let icon=c.leader?'♟':c.treasure?'◆':c.tile!==null?'■':c.wonder?'✦':c.face?'▣':c.cat?'×':'·'; return '<div class="selectedCard"><div class="big"><b>'+icon+' '+coord(selected.x,selected.y)+'</b></div><div class="sub">'+esc(desc)+'</div></div>';}
        function incomePreviewHTML(){if(!G)return ''; let p=G.turn, gains=[0,0,0,0], wonder=false; let cps=comps(); for(const co of cps){let own=co.leaders.filter(l=>l.p===p); if(!own.length)continue; let monColors=[], hasWonder=false; for(const [x,y] of co.cells){let c=cell(x,y); if(c.monumentColors)monColors.push(...c.monumentColors); if(c.wonder)hasWonder=true;} for(const l of own){for(const mc of monColors)if(mc===l.color)gains[l.color]++; if(l.color===BLACK&&hasWonder)wonder=true;}} let gainTxt=gains.map((v,i)=>v?SHORT[i]+' +'+v:'').filter(Boolean).join(', ')||'none'; return '<b>End-turn income preview</b><br>Monuments: '+gainTxt+(wonder?'<br>Wonder: your king will choose 1 VP colour.':'<br>Wonder: none.');}
        function actionContextHTML(){let a=document.getElementById('action').value, color=+document.getElementById('color').value; let phase=pendingSupport?'Resolve support':pendingWarOrder?'Choose war order':(G.players[G.turn].ai?'AI turn':''); let income='<div class="v65IncomePreview">'+incomePreviewHTML()+'</div>'; if(phase)return '<b>'+phase+'</b><br>'+colorizeText(eligibilityReason(a,color,selected.x,selected.y))+'<br>'+income; return income;}
        function autoSave(reason){try{if(!G)return; let item={id:'autosave',ts:new Date().toISOString(),name:'Autosave',summary:saveSummary(G)+'; '+reason,g:JSON.stringify(G)}; let saves=getSaves().filter(s=>s.id!=='autosave'); saves.unshift(item); setSaves(saves);}catch(e){}}
        function undoLastAction(){if(!preActionSnapshot){flash('Nothing to undo from the current turn.');return;} if(pendingSupport||pendingWarOrder||G.players[G.turn].ai){flash('Cannot undo during conflict resolution or AI turn.');return;} if(!confirm('Undo your last action? This is intended for the current local action before you end the turn.'))return; G=JSON.parse(preActionSnapshot); preActionSnapshot=null; normalizeSettings(); flash('Last action undone.'); render(); autoSave('undo');}
        function setActivePanel(id){activePanel=id; ['controls','legend','log','menuPanel'].forEach(pid=>{let el=document.getElementById(pid); if(el)el.classList.toggle('collapsed', pid!==id);}); updateActivePanelButtons(); setTimeout(()=>{resizeCanvas(); if(G)render();},70);}
        function updateActivePanelButtons(){document.querySelectorAll('#hudButtons button[data-panel]').forEach(b=>b.classList.toggle('activeTab', b.getAttribute('data-panel')===activePanel));}
        
        function playerStripHTML(){if(!G)return ''; return G.players.map((pl,i)=>{let active=i===G.turn; let role=i===0?'You':'AI'; return '<div class="playerChip '+(active?'active':'')+'"><b>'+playerMark(i)+' '+esc(pl.name)+'</b><div class="vpMini">'+role+' · Treasures '+pl.treasures+'</div></div>';}).join('');}
        function phaseBadgeHTML(){if(!G)return ''; let phase=pendingSupport?'Support':pendingWarOrder?'War order':(G.players[G.turn].ai?'AI turn':'Your turn'); return phase+' · '+playerMark(G.turn)+' '+G.players[G.turn].name+' · action '+(3-G.actions)+' / 2';}
        function historyHTML(){if(!G)return ''; let html='', open=false; for(const s of G.log){let safe=colorizeText(s); if(/^TURN START:|^Game started|^CONTINUED|^SAVED|^GAME OVER/.test(s)){if(open)html+='</div>'; html+='<div class="turnGroup"><b>'+safe+'</b>'; open=true;} else {if(!open){html+='<div class="turnGroup">'; open=true;} html+='<span class="turnLine">'+safe+'</span>';}} if(open)html+='</div>'; return html;}
        function endTurnChecklist(){let p=G.turn, recs=[]; recs.push('• Actions remaining: '+G.actions); recs.push('• Monument/wonder income will now be checked.'); recs.push('• Your hand and any short hands refill to six if the bag allows.'); recs.push('• Game-end check: '+boardTreasures()+' treasure(s) remain on the board.'); recs.push('• Current selected space: '+coord(selected.x,selected.y)+' — '+describeCell(selected.x,selected.y)); return recs.join('\n');}
        function zoomBoard(f){if(!G)return; let old=G.boardZoom||1; G.boardZoom=Math.max(1,Math.min(5,old*f)); resizeCanvas(); flash('Board zoom: '+Math.round(G.boardZoom*100)+'%. Drag the board area when zoomed.');}
        function resetBoardZoom(){if(!G)return; G.boardZoom=1; resizeCanvas(); flash('Board fit to screen.');}
        
        function refreshEligibilityMessage(){if(G){flash(eligibilityText()); render();}}
        function isEligibleForCurrentAction(x,y){let a=document.getElementById('action').value, color=+document.getElementById('color').value; if(a==='tile')return legalTile(G.turn,color,x,y); if(a==='leader')return legalLeader(G.turn,color,x,y); if(a==='cat')return !playCatCheck(G.turn,x,y); if(a==='withdraw'){let c=cell(x,y);return !!(c.leader&&c.leader.p===G.turn);} return false;}
        function playCatCheck(p,x,y){let c=cell(x,y); if(c.leader||c.mon||c.wonder||c.treasure||c.building!==null)return 'Illegal catastrophe.'; if(G.players[p].cat<=0)return 'No catastrophes left.'; return null;}
        function coord(x,y){return String.fromCharCode(65+x)+(y+1)}
        function requestNativeOrientation(mode){try{if(window.AndroidBridge&&AndroidBridge.setOrientation)AndroidBridge.setOrientation(mode);}catch(e){}}
        function applyGameLayout(){let on=!!(G&&G.uiHorizontal); document.body.classList.toggle('horiz',on); let b=document.getElementById('layoutBtn'); if(b)b.textContent=on?'Portrait':'Landscape'; if(!activePanel)activePanel='controls'; setActivePanel(activePanel); setTimeout(()=>{resizeCanvas(); if(G)render();},120);}
        function toggleGameLayout(){if(!G)return; G.uiHorizontal=!G.uiHorizontal; G.boardZoom=1; applyGameLayout(); requestNativeOrientation(G.uiHorizontal?'landscape':'portrait'); setTimeout(()=>requestNativeOrientation(G.uiHorizontal?'sensorLandscape':'sensorPortrait'),350); flash(G.uiHorizontal?'Landscape layout.':'Portrait layout.'); setTimeout(()=>{resizeCanvas();render();},650); setTimeout(()=>{resizeCanvas();render();},1200);}
        function togglePanel(id){setActivePanel(id);}
        function centerBoard(){['controls','legend','log','menuPanel'].forEach(pid=>{let el=document.getElementById(pid); if(el)el.classList.add('collapsed');}); activePanel='board'; updateActivePanelButtons(); resetBoardZoom(); flash('Board centred and panels hidden. Tap Actions, Info, History, or Menu to reopen a panel.');}
        function resizeCanvas(){let can=board, wrap=canvasWrap; if(!wrap||!can)return; let zoom=(G&&G.boardZoom)||1, horiz=document.body.classList.contains('horiz'); let safety=horiz?8:0; let availW=Math.max(180,wrap.clientWidth-safety), availH=Math.max(130,wrap.clientHeight-safety); let fit=Math.min(availW/W,availH/H); let cellSize=Math.max(8,Math.floor(fit)); let w=W*cellSize, h=H*cellSize; can.style.width=Math.max(1,Math.floor(w*zoom))+'px'; can.style.height=Math.max(1,Math.floor(h*zoom))+'px'; wrap.classList.toggle('zoomed',zoom>1.01); if(zoom<=1.01){wrap.scrollLeft=0;wrap.scrollTop=0;} else {setTimeout(()=>{wrap.scrollLeft=Math.max(0,(can.clientWidth-wrap.clientWidth)/2);wrap.scrollTop=Math.max(0,(can.clientHeight-wrap.clientHeight)/2);},0);}}
        window.addEventListener('resize',()=>{if(G){setTimeout(()=>{resizeCanvas();render();},80);}});
        let boardDrag=null; canvasWrap.addEventListener('pointerdown',e=>{if(!G||G.boardZoom<=1.01)return; boardDrag={x:e.clientX,y:e.clientY,l:canvasWrap.scrollLeft,t:canvasWrap.scrollTop,moved:false}; canvasWrap.setPointerCapture&&canvasWrap.setPointerCapture(e.pointerId);}); canvasWrap.addEventListener('pointermove',e=>{if(!boardDrag)return; let dx=e.clientX-boardDrag.x, dy=e.clientY-boardDrag.y; if(Math.abs(dx)+Math.abs(dy)>3)boardDrag.moved=true; canvasWrap.scrollLeft=boardDrag.l-dx; canvasWrap.scrollTop=boardDrag.t-dy;}); canvasWrap.addEventListener('pointerup',()=>{setTimeout(()=>{boardDrag=null;},0);});
        board.addEventListener('click',e=>{if(boardDrag&&boardDrag.moved)return;let r=board.getBoundingClientRect(), x=Math.floor((e.clientX-r.left)/r.width*W), y=Math.floor((e.clientY-r.top)/r.height*H); if(inside(x,y)){selected={x,y}; let desc=cellDescription(x,y); if(!G.players[G.turn].ai)flash(desc+' — '+eligibilityText(x,y)); else flash(desc); render();}});
        function render(){
         if(!G)return; const can=board, ctx=can.getContext('2d'), cw=can.width/W, ch=can.height/H; ctx.clearRect(0,0,can.width,can.height);
         ctx.fillStyle=G.settings.advanced?'#c99c52':'#d7ae62'; ctx.fillRect(0,0,can.width,can.height);
         drawBoardBase(ctx,cw,ch);
         drawEligibilityOverlay(ctx,cw,ch); eachCell((c,x,y)=>drawCellContents(ctx,c,x,y,cw,ch));
         let boardAction=['tile','leader','cat','withdraw'].includes(document.getElementById('action').value); ctx.strokeStyle=(!boardAction||isEligibleForCurrentAction(selected.x,selected.y))?'#ffeb3b':'#ff5a49';ctx.lineWidth=6;ctx.strokeRect(selected.x*cw+3,selected.y*ch+3,cw-6,ch-6);
         syncRecycleInputs(); updateMiniSettings(); updateQuickActions(); renderChoiceChips(); document.getElementById('topbar').innerHTML=statusHTML(); document.getElementById('legend').innerHTML=legendHTML(); document.getElementById('eventBox').textContent=statusFlash; document.getElementById('previewBox').innerHTML=actionPreviewHTML(); document.getElementById('playerStrip').innerHTML=playerStripHTML(); document.getElementById('phaseBadge').innerHTML=phaseBadgeHTML(); document.getElementById('phaseBadge').classList.toggle('hidden',!G.settings.showPhase); document.getElementById('log').innerHTML=historyHTML(); let mp=document.getElementById('menuPanel'); let ib=mp&&mp.querySelector('#incomePreviewBox'); if(ib)ib.innerHTML=incomePreviewHTML(); let ac=document.getElementById('actionContext'); if(ac)ac.innerHTML=actionContextHTML(); updateActivePanelButtons(); updateDoActionButton();
        }
        function drawBoardBase(ctx,cw,ch){
         const pal=boardThemePalette();
         eachCell((c,x,y)=>{let px=x*cw,py=y*ch; ctx.fillStyle=c.river?pal.river:pal.land; ctx.fillRect(px,py,cw,ch); if(c.river){ctx.fillStyle=pal.riverHi; ctx.fillRect(px+cw*.08,py+ch*.08,cw*.84,ch*.84);} if(c.shedu){ctx.fillStyle=pal.shedu;ctx.fillRect(px+cw*.12,py+ch*.12,cw*.76,ch*.76);} if(c.special){ctx.strokeStyle=pal.special;ctx.lineWidth=7;ctx.strokeRect(px+6,py+6,cw-12,ch-12);ctx.strokeStyle=pal.special2;ctx.lineWidth=2.5;ctx.strokeRect(px+12,py+12,cw-24,ch-24);} ctx.strokeStyle=pal.grid;ctx.lineWidth=1.5;ctx.strokeRect(px,py,cw,ch); if(G.settings.showCoords){ctx.fillStyle='rgba(40,28,15,.55)';ctx.fillRect(px+3,py+3,Math.min(cw*.42,34),Math.min(ch*.20,18)); ctx.fillStyle='#fff5cf';ctx.font='900 '+(ch*.13)+'px Georgia';ctx.fillText(coord(x,y),px+6,py+Math.min(ch*.16,16));} });
         ctx.strokeStyle=pal.riverLine;ctx.lineWidth=Math.min(cw,ch)*.28;ctx.lineCap='round';
         eachCell((c,x,y)=>{if(!c.river)return; let cx=x*cw+cw/2,cy=y*ch+ch/2; for(const [nx,ny] of neighbors(x,y)){if(nx<x||ny<y)continue; if(cell(nx,ny).river){ctx.beginPath();ctx.moveTo(cx,cy);ctx.lineTo(nx*cw+cw/2,ny*ch+ch/2);ctx.stroke();}}});
        }
        function drawEligibilityOverlay(ctx,cw,ch){if(!G||!G.settings.showLegal||G.players[G.turn].ai||pendingSupport||pendingWarOrder)return; let a=document.getElementById('action').value; if(!['tile','leader','cat','withdraw'].includes(a))return; eachCell((c,x,y)=>{let px=x*cw,py=y*ch; if(isEligibleForCurrentAction(x,y)){ctx.fillStyle='rgba(65,170,70,.22)';ctx.fillRect(px+3,py+3,cw-6,ch-6);} }); if(!isEligibleForCurrentAction(selected.x,selected.y)){ctx.fillStyle='rgba(190,45,35,.22)';ctx.fillRect(selected.x*cw+3,selected.y*ch+3,cw-6,ch-6);}}
        function drawRoundRect(ctx,x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.quadraticCurveTo(x+w,y,x+w,y+r);ctx.lineTo(x+w,y+h-r);ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);ctx.lineTo(x+r,y+h);ctx.quadraticCurveTo(x,y+h,x,y+h-r);ctx.lineTo(x,y+r);ctx.quadraticCurveTo(x,y,x+r,y);ctx.closePath();}
        function drawSheduSiteLabel(ctx,c,px,py,cw,ch){
         ctx.save();
         ctx.fillStyle='rgba(85,60,31,.68)'; ctx.font='900 '+(ch*.17)+'px Georgia'; ctx.fillText(c.special?'Shedu★':'Shedu',px+cw*.08,py+ch*.30);
         ctx.restore();
        }
        function drawTreasureStateMarker(ctx,c,px,py,cw,ch){
         // Every Shedu starting treasure site gets the same status ribbon regardless of whether the temple is still face-up, has become a monument/wonder base, or is gone.
         // Gold means the treasure is still physically on that site; grey means that starting-site treasure has already been taken/removed.
         if(!c.treasure && !c.shedu)return;
         let isHere=!!c.treasure, isShedu=!!c.shedu;
         ctx.save();
         let w=isShedu?cw*.70:cw*.50, h=isShedu?ch*.21:ch*.20, x=px+cw*.15, y=py+ch*.72;
         if(c.face||c.wonder||c.mon){w=cw*.74;h=ch*.23;x=px+cw*.13;y=py+ch*.64;}
         ctx.fillStyle=isHere?'#f7d75a':'rgba(231,224,202,.88)';
         ctx.strokeStyle=isHere?'#5d3d08':'#6d6252'; ctx.lineWidth=isHere?3:2;
         drawRoundRect(ctx,x,y,w,h,7); ctx.fill(); ctx.stroke();
         ctx.fillStyle=isHere?'#4b3006':'#5a5146';
         ctx.textAlign='center';
         ctx.font='900 '+(isShedu?ch*.078:ch*.105)+'px Georgia';
         ctx.fillText(isHere?'TREASURE':'TAKEN',x+w/2,y+h*.62);
         if(isShedu){ctx.font='900 '+(ch*.062)+'px Georgia'; ctx.fillText('START SITE',x+w/2,y+h*.92);}
         ctx.textAlign='left'; ctx.restore();
        }
        function drawCellContents(ctx,c,x,y,cw,ch){let px=x*cw,py=y*ch;
         if(c.shedu){drawSheduSiteLabel(ctx,c,px,py,cw,ch);}
         if(c.cat){ctx.fillStyle='#704126';drawRoundRect(ctx,px+8,py+8,cw-16,ch-16,8);ctx.fill();ctx.strokeStyle='#f6dfb0';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(px+cw*.30,py+ch*.30);ctx.lineTo(px+cw*.70,py+ch*.70);ctx.moveTo(px+cw*.70,py+ch*.30);ctx.lineTo(px+cw*.30,py+ch*.70);ctx.stroke();}
         if(c.face||c.wonder){ctx.fillStyle=c.wonder?'#cdbb82':'#9a8c73';drawRoundRect(ctx,px+9,py+9,cw-18,ch-18,8);ctx.fill();ctx.fillStyle='#3e3421';ctx.font='900 '+(ch*.16)+'px Georgia';ctx.fillText(c.wonder?'Wonder':'Monument base',px+cw*.11,py+ch*.55);}
         if(c.tile!==null&&!c.face&&!c.wonder){ctx.fillStyle=HEX[c.tile];drawRoundRect(ctx,px+10,py+10,cw-20,ch-20,9);ctx.fill();ctx.strokeStyle='#fff8';ctx.lineWidth=2;ctx.stroke();ctx.fillStyle=TEXTHEX[c.tile];ctx.font='900 '+(ch*.19)+'px Georgia';ctx.textAlign='center';ctx.fillText(TILE_SHORT[c.tile],px+cw*.50,py+ch*.55);ctx.textAlign='left';}
         if(c.union!==null){ctx.fillStyle='rgba(255,250,210,.92)';drawRoundRect(ctx,px+cw*.18,py+ch*.33,cw*.64,ch*.28,6);ctx.fill();ctx.strokeStyle='#5f3b16';ctx.lineWidth=2;ctx.stroke();ctx.fillStyle='#4a2b10';ctx.font='900 '+(ch*.105)+'px Georgia';ctx.textAlign='center';ctx.fillText('UNIFY',px+cw*.50,py+ch*.51);ctx.textAlign='left';}
         if(c.monumentColors){ctx.fillStyle=HEX[c.monumentColors[0]];drawRoundRect(ctx,px+cw*.16,py+ch*.14,cw*.32,ch*.72,7);ctx.fill();ctx.fillStyle=HEX[c.monumentColors[1]];drawRoundRect(ctx,px+cw*.50,py+ch*.14,cw*.32,ch*.72,7);ctx.fill();ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.strokeRect(px+cw*.16,py+ch*.14,cw*.66,ch*.72);}
