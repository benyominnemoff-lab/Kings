          }
          function killOldFinishSheets(){['v44EarlyEnd','v59EndTurn','v69EndTurn','v70EndTurn','v71EndTurn','v72EndTurn'].forEach(function(id){var el=q(id);if(el)el.remove();});}
          function closeSheet(){var el=q('v73EndTurn');if(el)el.style.display='none';}
          async function endNow(){
            closeSheet();
            try{if(hasGame()&&Number(G.actions)>0&&typeof addNote59==='function')addNote59('Ended the turn with '+G.actions+' unused action'+(G.actions===1?'':'s')+'.',G.turn);}catch(_){ }
            try{if(typeof endTurn==='function')await Promise.resolve(endTurn()); else if(window.endTurn)await Promise.resolve(window.endTurn());}catch(err){console.error('v73 end turn failed',err);}
            setTimeout(paint73,0);setTimeout(paint73,120);setTimeout(bindFinish73,120);
          }
          function showFinishSheet(items){
            killOldFinishSheets();
            var el=q('v73EndTurn');if(!el){el=document.createElement('div');el.id='v73EndTurn';document.body.appendChild(el);}
            el.className='v73Sheet';
            var list=(items&&items.length?items:['No strong move found']).slice(0,3);
            el.innerHTML='<div class="v73Card"><h2>AI recommendations for you</h2><ol class="v73RecList">'+list.map(function(x){return '<li>'+safeEsc(x)+'</li>';}).join('')+'</ol><div class="v73Buttons"><button id="v73FinishGo">Finish turn</button><button id="v73FinishCancel" class="secondary">Keep playing</button></div></div>';
            el.style.display='flex';
            var go=q('v73FinishGo'),ca=q('v73FinishCancel');
            if(go)go.addEventListener('click',function(ev){ev.preventDefault();ev.stopPropagation();endNow();},false);
            if(ca)ca.addEventListener('click',function(ev){ev.preventDefault();ev.stopPropagation();closeSheet();},false);
          }
          function finishHumanTurn73(){
            try{
              if(!hasGame()||G.over)return false;
              if(pendingSupport||pendingWarOrder){try{flash('Resolve the current war/support choice first.');}catch(_){ }return false;}
              if(aiNow())return false;
              if(Number(G.actions)>0){showFinishSheet(recommendations());return false;}
              endNow();return false;
            }catch(err){console.error('v73 finish failed',err);return false;}
          }
          function mainFinishButton(b){var controls=q('controls');return !!(b&&controls&&controls.contains(b)&&txt(b)==='finish turn'&&!(q('v73EndTurn')&&q('v73EndTurn').contains(b)));}
          function bindFinish73(){
            try{
              var controls=q('controls');if(!controls)return;
              Array.prototype.slice.call(controls.querySelectorAll('button')).forEach(function(b){
                if(mainFinishButton(b)&&b.dataset.v73Finish!=='1'){
                  var nb=b.cloneNode(true);
                  nb.removeAttribute('onclick');
                  nb.textContent='Finish turn'+ZW;
                  nb.dataset.v73Finish='1';
                  nb.addEventListener('click',function(ev){ev.preventDefault();ev.stopPropagation();ev.stopImmediatePropagation&&ev.stopImmediatePropagation();finishHumanTurn73();return false;},false);
                  b.parentNode.replaceChild(nb,b);
                }
              });
            }catch(err){console.error('v73 bind failed',err);}
          }
          function install73(){
            css73();
            try{window.incomePreviewHTML=function(){return incomeHTML();}; incomePreviewHTML=window.incomePreviewHTML;}catch(_){ }
            try{window.actionContextHTML=function(){return '';}; actionContextHTML=window.actionContextHTML;}catch(_){ }
            try{window.finishHumanTurn=finishHumanTurn73; finishHumanTurn=finishHumanTurn73; window.finishHumanTurn73=finishHumanTurn73; window.finishHumanTurn72=finishHumanTurn73; window.finishHumanTurn71=finishHumanTurn73; window.finishHumanTurn69=finishHumanTurn73; window.finishHumanTurn59=finishHumanTurn73;}catch(_){ }
            try{var oldUpd=window.updateDoActionButton; if(!window.__v73UpdatePatched){window.__v73UpdatePatched=true; window.updateDoActionButton=function(){try{oldUpd&&oldUpd.apply(this,arguments);}catch(e){console.error('v73 base update failed',e);}paint73();bindFinish73();}; try{updateDoActionButton=window.updateDoActionButton;}catch(_){ }}}catch(_){ }
            try{var oldRefresh=window.refreshEligibilityMessage; if(!window.__v73RefreshPatched){window.__v73RefreshPatched=true; window.refreshEligibilityMessage=function(){try{oldRefresh&&oldRefresh.apply(this,arguments);}catch(e){console.error('v73 refresh base failed',e);}paint73();bindFinish73();}; try{refreshEligibilityMessage=window.refreshEligibilityMessage;}catch(_){ }}}catch(_){ }
            try{if(!window.__v73RenderPatched&&window.render){window.__v73RenderPatched=true;var base=window.render;var rr=function(){var out=base.apply(this,arguments);paint73();bindFinish73();return out;};window.render=rr;try{render=rr;}catch(_){ }}}catch(_){ }
            try{document.addEventListener('click',function(ev){
              var b=ev.target&&ev.target.closest&&ev.target.closest('button');
              if(mainFinishButton(b)){ev.preventDefault();ev.stopPropagation();ev.stopImmediatePropagation&&ev.stopImmediatePropagation();finishHumanTurn73();}
            },true);}catch(_){ }
            ['action','color','rec0','rec1','rec2','rec3'].forEach(function(id){var el=q(id);if(el)el.addEventListener('change',function(){setTimeout(function(){paint73();bindFinish73();},0);},true);});
            bindFinish73();paint73();killOldFinishSheets();
            setTimeout(function(){bindFinish73();paint73();},80);
            setTimeout(function(){bindFinish73();paint73();},350);
            setInterval(function(){if(isPlaying()){bindFinish73();paint73();}},1000);
          }
          if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',install73);else install73();
        })();
        </script>
        </body>
        </html>
        EOF
    - name: Download Gradle
      run: |
        curl -L -o gradle.zip https://services.gradle.org/distributions/gradle-8.7-bin.zip
        unzip -q gradle.zip
    - name: Build debug APK
      run: ./gradle-8.7/bin/gradle --no-daemon assembleDebug
    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: Kings-of-the-Two-Rivers-debug-apk
        path: app/build/outputs/apk/debug/app-debug.apk
