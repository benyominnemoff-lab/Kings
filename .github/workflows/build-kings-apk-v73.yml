        function scoreEndOfTurn(p){let cps=comps(); for(const co of cps){let own=co.leaders.filter(l=>l.p===p); if(!own.length)continue; let monColors=[]; let hasWonder=false; for(const [x,y] of co.cells){let c=cell(x,y); if(c.monumentColors)monColors.push(...c.monumentColors); if(c.wonder)hasWonder=true;} for(const l of own){let gains=monColors.filter(c=>c===l.color).length; if(gains){G.players[p].vp[l.color]+=gains; log(G.players[p].name+' gains '+gains+' '+VP[l.color]+' from monument(s).');} if(l.color===BLACK&&hasWonder){let ch=chooseLowestColor(p); G.players[p].vp[ch]++; log(G.players[p].name+' gains 1 '+VP[ch]+' from the wonder.');}}}}
        function chooseLowestColor(p){let v=G.players[p].vp, m=Math.min(...v), idx=v.indexOf(m); if(G.players[p].ai)return idx; let choices=CNAME.map((n,i)=>(i+1)+': '+n+' '+VP[i]).join('\n'); let ans=prompt('Wonder scoring: your king is linked to the wonder. Choose a victory point colour by number:\n'+choices, String(idx+1)); let n=(parseInt(ans||'',10)||0)-1; if(!Number.isFinite(n)||n<0||n>3){n=idx; flash('Wonder scoring: invalid choice, so your current lowest colour was chosen: '+CNAME[n]+'.');} else {flash('Wonder scoring: you chose '+CNAME[n]+' '+VP[n]+'.');} return n;}
        function gameOver(){if(G.finalized)return; G.over=true; G.finalized=true; let scores=G.players.map((pl,i)=>({i,name:pl.name,vec:bestScore(pl.vp,pl.treasures),base:pl.vp.slice(),treasures:pl.treasures})); scores.sort((a,b)=>compareVec(b.vec,a.vec)); let msg='Game over!\nScores shown lowest-to-highest after best treasure allocation.\n\n'+scores.map(s=>s.name+': '+s.vec.join('/')+'  (treasures: '+s.treasures+')').join('\n'); alert(msg); log('GAME OVER. Winner: '+scores[0].name+' by lowest-sphere comparison.'); render();}
