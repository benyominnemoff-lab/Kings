        <body>
        <header><h1>Kings of the Two Rivers</h1><div class="small">✦ 𒀭 ✦</div></header>
        <section id="setup">
          <div id="homeHero"><div class="emblem">♛</div><h1>Kings of the Two Rivers</h1><div class="flourish">✦ 𒀭 ✦</div></div>
          <div class="card">
            <h2>Players and AI</h2>
            <label for="aiCount">Automated opponents</label>
            <select id="aiCount"><option>1</option><option>2</option><option selected>3</option></select>
            <label for="aiLevel">Automated opponent level</label>
            <select id="aiLevel"><option value="easy">Easy — forgiving</option><option value="regular" selected>Regular — balanced</option><option value="hard">Hard — ruthless</option></select>
            <label for="playerSymbol">Your dynasty symbol</label>
            <select id="playerSymbol"><option value="BOW" selected>Bow</option><option value="BULL">Bull</option><option value="POT">Pot</option><option value="LION">Lion</option></select>
          </div>
          <div class="card">
            <h2>Board and separate rule toggles</h2>
            <label for="boardSide">Board layout</label>
            <select id="boardSide"><option value="standard" selected>Standard board</option><option value="advanced">Advanced board</option></select>
            <div class="check"><input id="ruleBuildings" type="checkbox"><div><b>Civilisation buildings</b><span>Adds buildings.</span></div></div>
            <div class="check"><input id="ruleEnglish" type="checkbox"><div><b>English variant</b><span>Stricter support.</span></div></div>
            <div class="check"><input id="ruleWonder" type="checkbox"><div><b>Wonder variant</b><span>Adds wonder.</span></div></div>
            <div class="check"><input id="showCoords" type="checkbox"><div><b>Show board coordinates</b><span>A1–P11 labels.</span></div></div>
            <div class="check"><input id="confirmImpact" type="checkbox" checked><div><b>Confirm impactful moves</b><span>Confirm big moves.</span></div></div>
            <div class="row setupActionRow"><button id="startGameBtn" type="button" onclick="return startGame59ButtonFix(event)">Start game</button><button class="secondary" onclick="showTutorial('setup')">Rule reminders</button></div>
          </div>
          <div class="card">
            <h2>Continue saved match</h2>
            <label for="saveSelect">Saved positions</label>
            <select id="saveSelect"><option>No saved matches found</option></select>
            <div id="saveDetails" class="note tiny">Choose a saved match by name and time.</div>
            <div class="row"><button class="secondary" onclick="populateSaveSelect()">Refresh saves</button><button onclick="continueSavedMatch()">Continue selected match</button><button class="danger" onclick="clearAllSavedMatches()">Clear all saved matches</button></div>
          </div>
        </section>
        <section id="game">
          <div id="topbar"></div>
          <div id="hudButtons"><button data-panel="controls" onclick="setActivePanel('controls')">Actions</button><button data-panel="legend" onclick="setActivePanel('legend')">Info</button><button data-panel="log" onclick="setActivePanel('log')">History</button><button data-panel="menuPanel" onclick="setActivePanel('menuPanel')">Menu</button><button onclick="centerBoard()">Board</button><button id="layoutBtn" onclick="toggleGameLayout()">Landscape</button></div>
          <div id="playerStrip"></div>
          <div id="phaseBadge"></div><div id="canvasWrap"><canvas id="board" width="1280" height="880"></canvas></div>
          <div id="legend"></div>
          <div id="eventBox">AI and conflict events will appear here.</div>
          <div id="previewBox">Select a space and action to see a rules preview.</div>
          <div id="controls">
            <div id="actionContext" class="panelIntro">Normal action phase. Choose an action or use a quick suggestion.</div>
            <div id="quickActions" class="quickRow"></div>
            <div id="actionChips" class="choiceChips"></div>
            <div id="colorChips" class="choiceChips"></div>
            <select id="action" onchange="refreshEligibilityMessage()"><option value="tile">Place civilisation tile</option><option value="leader">Place/move leader</option><option value="withdraw">Withdraw selected leader</option><option value="cat">Play catastrophe tile</option><option value="recycleCustom">Recycle chosen tile mix</option><option value="replaceAll">Recycle entire hand</option></select>
            <select id="color" onchange="refreshEligibilityMessage()"><option value="0">Black: settlement tile / king leader / bricks VP</option><option value="1">Red: temple tile / priest leader / amulets VP</option><option value="2">Blue: farm tile / farmer leader / crops VP</option><option value="3">Green: market tile / trader leader / goods VP</option></select>
