        async function doHumanAction(){if(G.over||G.players[G.turn].ai||pendingSupport||pendingWarOrder)return; preActionSnapshot=JSON.stringify(G); let p=G.turn, a=action.value, color=+document.getElementById('color').value, x=selected.x, y=selected.y; let imp=impactfulMoveText(a,color,x,y); if(G.settings.confirmImpact&&imp&&!confirm('Confirm impactful move:\n\n'+imp+'\n\nContinue?')){flash('Move cancelled.');return;} let err=null; if(a==='tile')err=await placeTile(p,color,x,y); else if(a==='leader')err=await placeLeader(p,color,x,y); else if(a==='withdraw'){let c=cell(x,y); if(c.leader&&c.leader.p===p){removeLeader(x,y); log('You withdrew a leader.'); spendAction();} else err='Select one of your leaders.';} else if(a==='cat')err=playCat(p,x,y); else if(a==='recycleCustom')err=replaceCustom(p,getRecycleCounts()); else if(a==='replaceAll')err=replaceTiles(p,color,true); if(err){preActionSnapshot=null; flash(err+' '+eligibilityText());} render(); autoSave('after action');}
        function aiProfile(){
         if(!G)return {mistake:0.25,top:10,noise:.45,cat:8,recycle:4,helpPenalty:0.65,risk:0.55};
         if(G.aiLevel==='easy')return {mistake:0.28,top:9,noise:.75,cat:8,recycle:4.25,helpPenalty:0.75,risk:0.55};
         if(G.aiLevel==='regular')return {mistake:0.10,top:5,noise:.28,cat:4.25,recycle:2.85,helpPenalty:1.05,risk:0.82};
         return {mistake:0.00,top:1,noise:.03,cat:2.4,recycle:2.05,helpPenalty:1.35,risk:1.08};
        }
        function vpVector(p){return G.players[p].vp.slice().sort((a,b)=>a-b);}
        function lowestVp(p){return Math.min(...G.players[p].vp);}
        function colourNeed(p,c){let v=G.players[p].vp, min=Math.min(...v); return Math.max(0,5-(v[c]-min));}
