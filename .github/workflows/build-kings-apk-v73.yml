        }
        function evaluateLeader(p,c,x,y){
         let v=1.1+colourNeed(p,c)*1.1, old=G.players[p].leaders[c], oldCell=null, prof=aiProfile(), rival=mainRival(p);
         if(old){oldCell=cell(old.x,old.y); oldCell.leader=null; v-=0.9;} else v+=1.25;
         let tmp=cell(x,y); tmp.leader={p,color:c}; let co=compAt(x,y);
         if(co){
          let treasures=compTreasures(co), ownOther=co.leaders.filter(l=>l.p===p&&l.color!==c).length, enemySame=co.leaders.find(l=>l.p!==p&&l.color===c);
          if(c===GREEN)v+=treasures*4.2; else if(treasures>1)v+=treasures*.75;
          if(enemySame){let odds=revoltForecast(p,c,x,y); v+=odds; if(enemySame.p===rival&&odds>0)v+=1.4;}
          if(ownOther)v+=1.2+ownOther*.35;
          v+=Math.min(3.2,co.cells.length/7);
          if(c===BLACK){let missingColors=[1,2,3].filter(col=>!co.leaders.some(l=>l.color===col)); v+=missingColors.length*.45;}
          if(c!==BLACK&&!co.leaders.some(l=>l.color===c&&l.p!==p))v+=.75;
          if(co.leaders.some(l=>l.p!==p&&l.p===rival))v+=.4;
         }
