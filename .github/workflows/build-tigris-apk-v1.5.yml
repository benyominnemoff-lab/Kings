name: Build Tigris APK v1.5
on:
  workflow_dispatch:
jobs:
  build-apk:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
    - name: Check out repository
      uses: actions/checkout@v4
    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'
    - name: Set up Android SDK
      uses: android-actions/setup-android@v3
    - name: Install Android platform
      run: |
        yes | sdkmanager --licenses >/dev/null || true
        sdkmanager "platforms;android-35" "build-tools;35.0.0"
    - name: Generate Android project
      run: |
        set -euxo pipefail
        mkdir -p app/src/main/java/com/auroranem/tigrisandeuphrates app/src/main/assets app/src/main/res/values app/src/main/res/drawable
        cat > settings.gradle <<'EOF'
        pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
        dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
        rootProject.name='TigrisAndEuphrates'
        include ':app'
        EOF
        cat > build.gradle <<'EOF'
        plugins {
            id 'com.android.application' version '8.6.1' apply false
        }
        EOF
        cat > app/build.gradle <<'EOF'
        plugins { id 'com.android.application' }

        android {
            namespace 'com.auroranem.tigrisandeuphrates'
            compileSdk 35
            defaultConfig {
                applicationId 'com.auroranem.tigrisandeuphrates'
                minSdk 23
                targetSdk 35
                versionCode 150
                versionName '1.5'
            }
            signingConfigs {
                release {
                    storeFile file('../release-keystore.jks')
                    storePassword 'changeit'
                    keyAlias 'tigrisRelease'
                    keyPassword 'changeit'
                }
            }
            buildTypes {
                release {
                    signingConfig signingConfigs.release
                    minifyEnabled false
                }
            }
        }
        EOF
        cat > app/src/main/AndroidManifest.xml <<'EOF'
        <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <application android:theme="@style/AppTheme" android:label="Tigris &amp; Euphrates" android:icon="@drawable/ic_launcher" android:allowBackup="false" android:supportsRtl="true">
                <activity android:name=".MainActivity" android:configChanges="orientation|screenSize|keyboardHidden" android:exported="true">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>
            </application>
        </manifest>

        EOF
        cat > app/src/main/res/values/styles.xml <<'EOF'
        <resources>
            <style name="AppTheme" parent="android:style/Theme.Material.Light.NoActionBar">
                <item name="android:windowNoTitle">true</item>
                <item name="android:windowActionBar">false</item>
                <item name="android:fontFamily">serif</item>
                <item name="android:colorAccent">#7b4f25</item>
                <item name="android:windowLightStatusBar">false</item>
                <item name="android:statusBarColor">#3f2917</item>
                <item name="android:navigationBarColor">#3f2917</item>
            </style>
        </resources>
        EOF
        cat > app/src/main/res/drawable/ic_launcher.xml <<'EOF'
        <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108">
