    - name: Download Gradle
      run: |
        curl -L -o gradle.zip https://services.gradle.org/distributions/gradle-8.7-bin.zip
        unzip -q gradle.zip
    - name: Create signing key
      run: |
        keytool -genkeypair -keystore release-keystore.jks -storepass changeit -keypass changeit -alias tigrisRelease -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Tigris & Euphrates, OU=Personal, O=Personal, L=NA, S=NA, C=US"
    - name: Build APK
      run: ./gradle-8.7/bin/gradle --no-daemon assembleRelease
    - name: Prepare APK artifact
      run: |
        mkdir -p dist
        cp app/build/outputs/apk/release/app-release.apk "dist/Tigris & Euphrates v1.2.7.apk"
    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: 'Tigris & Euphrates v1.2.7'
        path: 'dist/Tigris & Euphrates v1.2.7.apk'
